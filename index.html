  /** สัดส่วนพื้นที่กราฟที่ต้องการให้โหนดกิน (เหลือขอบรอบๆ) */
  const VIEWPORT_LAYOUT_FRACTION = 0.8;

  function estimateDirectedDepth(nodes, links) {
    if (!nodes || !nodes.length) return 3;
    const ids = new Set(nodes.map(n => n.id));
    const depth = new Map();
    ids.forEach(id => depth.set(id, 0));
    const edgeList = [];
    (links || []).forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      if (!ids.has(s) || !ids.has(t)) return;
      edgeList.push([s, t]);
    });
    if (!edgeList.length) {
      return Math.min(14, Math.max(2, Math.ceil(1.2 + Math.log2(nodes.length + 1))));
    }
    let changed = true;
    let iter = 0;
    const maxIter = nodes.length + 12;
    while (changed && iter < maxIter) {
      changed = false;
      iter++;
      edgeList.forEach(([s, t]) => {
        const nd = (depth.get(s) || 0) + 1;
        if (nd > (depth.get(t) || 0)) {
          depth.set(t, nd);
          changed = true;
        }
      });
    }
    let maxD = 0;
    depth.forEach(v => { if (v > maxD) maxD = v; });
    return Math.min(26, Math.max(2, maxD + 1));
  }

  /**
   * ระยะ DAG + ฐานลิงก์แบบ dynamic จากขนาด #graph-container (~80% กว้าง/สูง)
   * ผสมระยะแนวนอน (ชั้นกราฟ) กับแนวตั้ง (ความหนาแน่น) ให้สมดุล
   */
  function computeDynamicLayoutMetrics(nodes, links, nodeCount) {
    const el = document.getElementById('graph-container');
    const W = (el && el.clientWidth) || 920;
    const H = (el && el.clientHeight) || 680;
    const uw = W * VIEWPORT_LAYOUT_FRACTION;
    const uh = H * VIEWPORT_LAYOUT_FRACTION;
    const n = Math.max(1, nodeCount || (nodes && nodes.length) || 1);
    const L = (nodes && nodes.length && links) ? estimateDirectedDepth(nodes, links) : Math.min(14, Math.max(3, Math.round(2 + Math.log2(n + 2))));
    const horizUnits = Math.max(L - 1, 1);
    const dagLevelPx = uw / horizUnits;
    const estRows = Math.max(2, Math.ceil(n / Math.max(horizUnits, 1)));
    const vertUnit = uh / Math.max(estRows, 2);
    const linkBasePx = Math.sqrt((dagLevelPx / 2.35) * (vertUnit * 0.92));
    return {
      dagLevelPx: Math.max(64, Math.min(460, dagLevelPx)),
      linkBasePx: Math.max(38, Math.min(235, linkBasePx)),
      L,
      uw,
      uh,
    };
  }

  function getUserLinkScale() {
    return (parseInt(document.getElementById('link-distance').value, 10) || 165) / 165;
  }

  /** ระยะแนวนอนระหว่างชั้น DAG — ผูกกับ viewport ~80% + โครงสร้างกราฟ */
  function computeDagLevelDistancePx(nodeCount, nodes, links) {
    const nc = Math.max(1, nodeCount != null ? nodeCount : (lastNodeCount || 1));
    const ns = Array.isArray(nodes) ? nodes : (lastVisibleGraphForLayout.nodes || []);
    const ls = Array.isArray(links) ? links : (lastVisibleGraphForLayout.links || []);
    const m = computeDynamicLayoutMetrics(ns, ls, nc);
    return Math.round(m.dagLevelPx * getUserLinkScale());
  }

  function computeLinkBasePx(nodeCount, nodes, links) {
    const nc = Math.max(1, nodeCount != null ? nodeCount : (lastNodeCount || 1));
    const ns = Array.isArray(nodes) ? nodes : (lastVisibleGraphForLayout.nodes || []);
    const ls = Array.isArray(links) ? links : (lastVisibleGraphForLayout.links || []);
    const m = computeDynamicLayoutMetrics(ns, ls, nc);
    return Math.max(34, Math.min(248, m.linkBasePx * getUserLinkScale()));
  }

  /**
   * บังคับทิศทางเส้นให้ไหลซ้าย -> ขวา (ยกเว้นหน้าแรก)
   * ใช้กับลิงก์ที่มองเห็นทั้งหมดในวิวปัจจุบัน
   */
  function buildLeftToRightFlowForce(links, minGap, strength) {
    const ls = Array.isArray(links) ? links : [];
    const gap = Math.max(24, minGap || 56);
    const k = Math.max(0.05, Math.min(0.55, strength || 0.22));
    return function (alpha) {
      const a = Math.max(0.06, alpha || 0.18);
      for (let i = 0; i < ls.length; i++) {
        const l = ls[i];
        const s = l && l.source;
        const t = l && l.target;
        if (!s || !t || s.x == null || t.x == null) continue;
        const need = (s.x + gap) - t.x;
        if (need <= 0) continue;
        const push = need * k * a;
        s.x -= push * 0.34;
        t.x += push * 0.66;
      }
    };
  }

  function applyLeftRightLayout(g, is3d, nodeCount, nodes, links) {
    const nc = nodeCount != null ? nodeCount : lastNodeCount;
    const homeGrid = isHomeUzOverview(nodes, links) && !is3d;
    if (homeGrid) {
      if (typeof g.dagMode === 'function') {
        g.dagMode(null);
        if (typeof g.onDagError === 'function') g.onDagError(() => {});
      }
      removeHomeUzLayoutForces(g);
      try { g.d3Force('ltrFlow', null); } catch (e) { /* ignore */ }
      refreshHomeUzLayoutForces(g, nodes, links);
    } else {
      clearHomeUzLayoutPropsOnNodes(nodes);
      removeHomeUzLayoutForces(g);
      if (typeof g.dagMode === 'function') {
        g.dagMode('lr');
        if (typeof g.dagLevelDistance === 'function') g.dagLevelDistance(computeDagLevelDistancePx(nc, nodes, links));
        if (typeof g.onDagError === 'function') g.onDagError(() => {});
      }
      const flowGap = Math.round(computeDagLevelDistancePx(nc, nodes, links) * 0.34);
      try { g.d3Force('ltrFlow', buildLeftToRightFlowForce(links, flowGap, 0.24)); } catch (e) { /* ignore */ }
    }
    if (is3d && typeof g.numDimensions === 'function') g.numDimensions(2);
    if (typeof g.linkDirectionalParticles === 'function') {
      const initialView = noDirectionalParticlesView();
      const particles = initialView ? 0 : 2;
      g.linkDirectionalParticles(particles);
      if (particles > 0) {
        g.linkDirectionalParticleSpeed(0.008);
        g.linkDirectionalParticleWidth(1.2);
      }
    }
  }

  /**
   * มุมมอง drill UZ: จัดแนวนอนให้สอดคล้องกราฟ Cause→Effect→UZ ปลายทาง
   * - UZ หลัก (ที่เลือก) อยู่ฝั่งซ้าย
   * - UZ ปลายทางที่เกิดจาก Effect_Tag ไปเป็น Cause_Tag ใน UZ อื่น อยู่ฝั่งขวา
   * - UZ ที่ block-link เข้าหลัก (ต้นทางจาก UZ อื่น) อยู่ซ้ายสุดกว่าหลัก
   */
  function applyRelatedUzLeftOfSelectedForce(g, nodeCount, nodes, links) {
    if (!g || typeof g.d3Force !== 'function') return;
    try {
      g.d3Force('uzRelatedX', null);
      g.d3Force('uzRelatedY', null);
    } catch (e) { /* ignore */ }
    if (typeof d3 === 'undefined' || !graphData) return;
    if (drillState.mode !== 'uz' || !drillState.uzBlock) return;
    const selId = 'uz_' + drillState.uzBlock;
    const upstream = new Set();
    const downstream = new Set();
    const mainCauseIds = new Set();
    const mainEffectIds = new Set();
    const downstreamCauseIds = new Set();
    const visUz = new Set((nodes || []).filter(n => n && n.type === 'uzblock').map(n => n.id));
    const visIds = new Set((nodes || []).map(n => n.id));

    // คอลัมน์ 2: Cause ใน UZ หลัก
    (nodes || []).forEach(n => {
      if (n && n.type === 'cause' && n.uzBlock === drillState.uzBlock) mainCauseIds.add(n.id);
    });
    // คอลัมน์ 3: Effect ที่มาจาก Cause ใน UZ หลัก
    (graphData.links || []).forEach(l => {
      if (!l || l.type !== 'effect') return;
      const s = linkEndpointId(l.source);
      const t = linkEndpointId(l.target);
      if (mainCauseIds.has(s) && visIds.has(t)) mainEffectIds.add(t);
    });
    // คอลัมน์ 4: Cause ปลายทางที่ถูกเปิดด้วย Effect_Tag
    (graphData.links || []).forEach(l => {
      if (!l || l.type !== 'cause-link') return;
      const s = linkEndpointId(l.source);
      const t = linkEndpointId(l.target);
      const cn = graphData.nodeById.get(t);
      if (!mainEffectIds.has(s) || !cn || cn.type !== 'cause' || !visIds.has(t)) return;
      downstreamCauseIds.add(t);
      if (cn.uzBlock) downstream.add('uz_' + cn.uzBlock);
    });
    // กันพลาด: ถ้าในวิวมี cause-link ข้าม UZ อยู่แล้ว ให้ถือว่า UZ ปลายทางนั้นอยู่ฝั่งขวาเสมอ
    (links || []).forEach(l => {
      if (!l || l.type !== 'cause-link') return;
      const t = linkEndpointId(l.target);
      const cn = graphData.nodeById.get(t);
      if (!cn || cn.type !== 'cause' || !cn.uzBlock) return;
      if (cn.uzBlock === drillState.uzBlock) return;
      const uzId = 'uz_' + cn.uzBlock;
      if (visUz.has(uzId)) downstream.add(uzId);
    });
    (graphData.blockLinks || []).forEach(bl => {
      const s = linkEndpointId(bl.source);
      const t = linkEndpointId(bl.target);
      if (t === selId && s !== selId) upstream.add(s);
      if (s === selId && t !== selId) downstream.add(t);
    });
    // รองรับกรณีไม่มี block-link โดยอนุมานจาก cause-link:
    // effect จาก UZ หลัก -> cause ใน UZ อื่น => UZ อื่นเป็นปลายทางฝั่งขวา
    (graphData.links || []).forEach(l => {
      if (!l || l.type !== 'cause-link') return;
      const effId = linkEndpointId(l.source);
      const causeId = linkEndpointId(l.target);
      const eff = graphData.nodeById.get(effId);
      const cn = graphData.nodeById.get(causeId);
      if (!eff || eff.type !== 'effect' || !cn || cn.type !== 'cause' || !cn.uzBlock) return;
      const toUzId = 'uz_' + cn.uzBlock;
      if (toUzId === selId) return;
      const fromMain = Array.isArray(eff.fromCauses) && eff.fromCauses.some(fc => {
        const c = graphData.nodeById.get(fc.causeId);
        return c && c.type === 'cause' && c.uzBlock === drillState.uzBlock;
      });
      if (fromMain) downstream.add(toUzId);
    });
    // บังคับเฉพาะโหนดที่แสดงอยู่ในหน้าปัจจุบัน
    [...upstream].forEach(id => { if (!visUz.has(id)) upstream.delete(id); });
    [...downstream].forEach(id => { if (!visUz.has(id)) downstream.delete(id); });
    const d = computeDagLevelDistancePx(nodeCount, nodes, links);
    const xUp = -d * 0.9;       // UZ ต้นทาง
    const xMain = -d * 0.62;    // Main UZ
    const xCause = -d * 0.14;   // Cause_Tag Number
    const xEffect = d * 0.24;   // Effect-Tag Number
    const xCauseTo = d * 0.62;  // Cause ปลายทาง
    const xDown = d * 1.18;     // UZ ปลายทางจาก Effect_Tag (ดันขวาชัดเจน)
    const fx = d3.forceX(n => {
      if (!n) return 0;
      if (mainCauseIds.has(n.id)) return xCause;
      if (mainEffectIds.has(n.id) || n.type === 'effect_bundle') return xEffect;
      if (downstreamCauseIds.has(n.id)) return xCauseTo;
      if (upstream.has(n.id)) return xUp;
      if (n.id === selId) return xMain;
      if (downstream.has(n.id)) return xDown;
      return 0;
    }).strength(n => {
      if (!n) return 0;
      if (mainCauseIds.has(n.id) || mainEffectIds.has(n.id) || downstreamCauseIds.has(n.id)) return 0.22;
      if (downstream.has(n.id)) return 0.44;
      if (upstream.has(n.id) || n.id === selId) return 0.29;
      return 0;
    });
    g.d3Force('uzRelatedX', fx);
    // ล็อกกึ่งกลางแนวตั้งเฉพาะคอลัมน์สำคัญให้ดูเป็นชั้นเหมือนแบบตัวอย่าง
    const fy = d3.forceY(n => {
      if (!n) return 0;
      if (n.id === selId || upstream.has(n.id) || downstream.has(n.id)) return 0;
      if (mainCauseIds.has(n.id) || mainEffectIds.has(n.id) || downstreamCauseIds.has(n.id)) return 0;
      return 0;
    }).strength(n => {
      if (!n) return 0;
      if (mainCauseIds.has(n.id) || mainEffectIds.has(n.id) || downstreamCauseIds.has(n.id)) return 0.08;
      return 0;
    });
    g.d3Force('uzRelatedY', fy);
    if (typeof g.d3ReheatSimulation === 'function') g.d3ReheatSimulation();
  }

  function applyNodeSeparation(g, nodeCount, nodes, links) {
    if (typeof g.d3Force !== 'function') return;
    const dist = computeLinkBasePx(nodeCount, nodes, links);
    const nc = nodeCount || 0;
    const linkF = g.d3Force('link');
    if (linkF && typeof linkF.distance === 'function') {
      linkF.distance(link => {
        const t = link.type || '';
        if (t === 'contains') return Math.max(dist * 1.2, 92);
        if (t === 'effect') return Math.max(dist * 2.15, 158);
        if (t === 'cause-link') return Math.max(dist * 2.35, 172);
        if (t === 'drill-next-uz') return Math.max(dist * 2.55, 190);
        if (t === 'uz-effect') return Math.max(dist * 2.15, 158);
        if (t === 'effect_bundle_in') return Math.max(dist * 1.75, 132);
        if (t === 'effect_bundle_out') return Math.max(dist * 1.25, 88);
        if (t === 'block-link') return Math.max(dist * 2.05, 148);
        if (t === 'detail-link') return Math.max(dist * 1.45, 112);
        return Math.max(dist * 1.85, 128);
      });
    }
    const ch = g.d3Force('charge');
    if (ch && typeof ch.strength === 'function') {
      let str = -255;
      if (nc > 450) str = -165;
      else if (nc > 280) str = -195;
      else if (nc > 120) str = -225;
      else if (nc <= 15) str = -310;
      ch.strength(str);
    }
    if (typeof g.d3VelocityDecay === 'function') g.d3VelocityDecay(nc > 350 ? 0.52 : 0.44);
    const heavy = nc > 450;
    try {
      if (typeof d3 !== 'undefined' && typeof d3.forceCollide === 'function') {
        if (!heavy) {
          g.d3Force('collide', d3.forceCollide()
            .radius(n => {
              if (n.type === 'uzblock') return 50;
              if (n.type === 'cause') return 138;
              if (n.type === 'effect') return 60;
              if (n.type === 'effect_bundle') return 22;
              if (n.type === 'detail_desc') return 104;
              if (n.type === 'detail_tag') return 40;
              return 24;
            })
            .strength(0.92)
            .iterations(3));
        } else {
          g.d3Force('collide', d3.forceCollide()
            .radius(n => {
              if (n.type === 'uzblock') return 38;
              if (n.type === 'cause') return 98;
              if (n.type === 'effect') return 44;
              if (n.type === 'effect_bundle') return 18;
              if (n.type === 'detail_desc') return 82;
              if (n.type === 'detail_tag') return 32;
              return 18;
            })
            .strength(0.78)
            .iterations(2));
        }
      }
    } catch (e) { console.warn('collide force:', e); }
    if (typeof g.d3ReheatSimulation === 'function') g.d3ReheatSimulation();
  }

  let selectedNode = null;

  function effectDescriptionText(eff, maxLen) {
    if (!eff) return '—';
    let t = '';
    if (eff.effectDescs && eff.effectDescs.length) t = eff.effectDescs.join(' | ');
    else t = eff.effectDesc || '';
    t = (t || '—').replace(/\s+/g, ' ').trim();
    if (maxLen && t.length > maxLen) return t.substring(0, maxLen - 1) + '…';
    return t || '—';
  }

  function buildRelationTable(node) {
    if (!node || !graphData) return '';
    if (node.type === 'uzblock') return buildUzBlockCauseEffectTable(node);
    if (node.type === 'cause') return buildCauseRelationTable(node);
    if (node.type === 'effect') return buildEffectRelationTable(node);
    return '<p>ไม่มีข้อมูล</p>';
  }

  function buildUzBlockCauseEffectTable(node) {
    const uz = node.uzBlock || '—';
    const uzDesc = (node.uzDesc || '—').replace(/\s+/g, ' ').trim();
    const uzDescShort = uzDesc.length > 500 ? uzDesc.substring(0, 497) + '…' : uzDesc;
    let html = '<table class="rel-meta"><tbody>';
    html += '<tr><th>UZ BLOCK</th><td colspan="4">' + escapeHtml(uz) + '</td></tr>';
    html += '<tr><th>UZ Description</th><td colspan="4">' + escapeHtml(uzDescShort) + '</td></tr>';
    html += '</tbody></table>';
    html += '<div class="rel-section-title">ความสัมพันธ์ Cause → Effect</div>';
    html += '<table class="rel-ce"><thead><tr>';
    html += '<th>Cause_Tag</th><th>Cause_Description</th><th>Effect_Tag</th><th>Effect_Description</th><th>Action</th>';
    html += '</tr></thead><tbody>';
    const causes = graphData.nodes.filter(n => n.uzBlock === node.uzBlock && n.type === 'cause');
    let rowCount = 0;
    causes.forEach(c => {
      graphData.links.forEach(l => {
        if (l.type !== 'effect') return;
        if (linkEndpointId(l.source) !== c.id) return;
        const eff = graphData.nodeById.get(linkEndpointId(l.target));
        if (!eff || eff.type !== 'effect') return;
        rowCount++;
        const cDesc = (c.causeDesc || '—').replace(/\s+/g, ' ').trim();
        const cDescS = cDesc.length > 220 ? cDesc.substring(0, 217) + '…' : cDesc;
        html += '<tr>';
        html += '<td>' + escapeHtml(c.causeTag || '—') + '</td>';
        html += '<td>' + escapeHtml(cDescS) + '</td>';
        html += '<td>' + escapeHtml(eff.effectTag || '—') + '</td>';
        html += '<td>' + escapeHtml(effectDescriptionText(eff, 220)) + '</td>';
        html += '<td>' + escapeHtml(String(l.effectAction || '—')) + '</td>';
        html += '</tr>';
      });
    });
    html += '</tbody></table>';
    if (rowCount === 0) html += '<p class="rel-empty">ไม่มีลิงก์ Cause→Effect ใน UZ นี้</p>';
    return html;
  }

  function buildCauseRelationTable(node) {
    let html = '<table class="rel-meta"><tbody>';
    html += '<tr><th>Cause_Tag</th><td colspan="4">' + escapeHtml(node.causeTag || '—') + '</td></tr>';
    const cd = (node.causeDesc || '—').replace(/\s+/g, ' ').trim();
    html += '<tr><th>Cause_Description</th><td colspan="4">' + escapeHtml(cd.length > 400 ? cd.substring(0, 397) + '…' : cd) + '</td></tr>';
    html += '</tbody></table>';
    html += '<div class="rel-section-title">Effect ที่เชื่อมจาก Cause นี้</div>';
    html += '<table class="rel-ce"><thead><tr>';
    html += '<th>Effect_Tag</th><th>Effect_Description</th><th>Action</th>';
    html += '</tr></thead><tbody>';
    let nEff = 0;
    graphData.links.forEach(l => {
      if (l.type !== 'effect' || linkEndpointId(l.source) !== node.id) return;
      const eff = graphData.nodeById.get(linkEndpointId(l.target));
      if (!eff || eff.type !== 'effect') return;
      nEff++;
      html += '<tr>';
      html += '<td>' + escapeHtml(eff.effectTag || '—') + '</td>';
      html += '<td>' + escapeHtml(effectDescriptionText(eff, 280)) + '</td>';
      html += '<td>' + escapeHtml(String(l.effectAction || '—')) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    if (nEff === 0) html += '<p class="rel-empty">ไม่มี Effect เชื่อมจาก Cause นี้</p>';
    return html;
  }

  function buildEffectRelationTable(node) {
    let html = '<table class="rel-meta"><tbody>';
    html += '<tr><th>Effect_Tag</th><td colspan="4">' + escapeHtml(node.effectTag || '—') + '</td></tr>';
    html += '<tr><th>Effect_Description</th><td colspan="4">' + escapeHtml(effectDescriptionText(node, 400)) + '</td></tr>';
    html += '</tbody></table>';
    html += '<div class="rel-section-title">ที่มา (Cause) และการทำงาน</div>';
    html += '<table class="rel-ce"><thead><tr>';
    html += '<th>Cause_Tag</th><th>Cause_Description</th><th>Action</th><th>รายละเอียดจากเซลล์ E</th>';
    html += '</tr></thead><tbody>';
    let n = 0;
    (node.fromCauses || []).forEach(fc => {
      n++;
      const cnode = graphData.nodeById.get(fc.causeId);
      const cDesc = cnode ? (cnode.causeDesc || '—') : '—';
      const cDescS = String(cDesc).replace(/\s+/g, ' ').trim();
      const rowDesc = (fc.effectDesc != null && String(fc.effectDesc).trim()) ? String(fc.effectDesc).trim() : '—';
      html += '<tr>';
      html += '<td>' + escapeHtml(fc.causeTag || '—') + '</td>';
      html += '<td>' + escapeHtml(cDescS.length > 180 ? cDescS.substring(0, 177) + '…' : cDescS) + '</td>';
      html += '<td>' + escapeHtml(String(fc.action || '—')) + '</td>';
      html += '<td>' + escapeHtml(rowDesc.length > 200 ? rowDesc.substring(0, 197) + '…' : rowDesc) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    if (n === 0) html += '<p class="rel-empty">ไม่มีข้อมูล Cause ที่เชื่อมเข้า Effect นี้</p>';

    const cross = [];
    graphData.links.forEach(l => {
      if (l.type !== 'cause-link' || linkEndpointId(l.source) !== node.id) return;
      const tgt = graphData.nodeById.get(linkEndpointId(l.target));
      if (tgt && tgt.type === 'cause') {
        cross.push(tgt);
      }
    });
    if (cross.length) {
      html += '<div class="rel-section-title">เชื่อมต่อเป็น Cause ถัดไป (cross)</div>';
      html += '<table class="rel-ce"><thead><tr><th>Cause_Tag</th><th>Cause_Description</th><th>UZ BLOCK</th></tr></thead><tbody>';
      cross.forEach(t => {
        html += '<tr>';
        html += '<td>' + escapeHtml(t.causeTag || '—') + '</td>';
        html += '<td>' + escapeHtml(String(t.causeDesc || '—').replace(/\s+/g, ' ').substring(0, 200)) + '</td>';
        html += '<td>' + escapeHtml(t.uzBlock || '—') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    return html;
  }

  function showRelationPanel(node) {
    const panel = document.getElementById('relation-panel');
    const wrap = document.getElementById('relation-table-wrap');
    // keep minimize state during node change
    applyRelationMinimizedState();
    if (!node) {
      panel.classList.remove('show');
      return;
    }
    selectedNode = node;
    wrap.innerHTML = '<h4>' + escapeHtml(node.name || node.id) + '</h4>' + buildRelationTable(node);
    panel.classList.add('show');
    applyRelationMinimizedState();
  }

  let relationMinimized = false;
  function applyRelationMinimizedState() {
    const panel = document.getElementById('relation-panel');
    const btn = document.getElementById('btn-minimize-rel');
    if (!panel || !btn) return;
    if (relationMinimized) {
      panel.classList.add('minimized');
      btn.textContent = '+';
      btn.title = 'ขยายตาราง';
    } else {
      panel.classList.remove('minimized');
      btn.textContent = '−';
      btn.title = 'ย่อตาราง';
    }
  }

  (function initRelationMinimize() {
    const btn = document.getElementById('btn-minimize-rel');
    if (!btn) return;
    btn.addEventListener('click', function () {
      relationMinimized = !relationMinimized;
      applyRelationMinimizedState();
    });
  })();

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function bumpZoomToFit() {
    const gi = graphInstance;
    if (!gi || typeof gi.zoomToFit !== 'function') return;
    const dur = 520;
    const el = document.getElementById('graph-container');
    const m = Math.min((el && el.clientWidth) || 800, (el && el.clientHeight) || 600);
    const pad = Math.max(24, Math.min(96, Math.round(m * (1 - VIEWPORT_LAYOUT_FRACTION) / 2)));
    setTimeout(() => { try { gi.zoomToFit(dur, pad); } catch (e) {} }, 40);
    setTimeout(() => { try { gi.zoomToFit(dur, pad); } catch (e) {} }, 320);
    setTimeout(() => { try { gi.zoomToFit(dur, pad); } catch (e) {} }, 780);
  }

  function snapshotViewState() {
    return {
      drillState: JSON.parse(JSON.stringify(drillState)),
      isolatedIds: isolatedSet && isolatedSet.size ? Array.from(isolatedSet) : null,
    };
  }

  function pushNavHistory() {
    if (!graphData) return;
    viewHistory.push(snapshotViewState());
    if (viewHistory.length > 100) viewHistory.shift();
    updateBackButton();
  }

  function clearNavHistory() {
    viewHistory.length = 0;
    updateBackButton();
  }

  function updateBackButton() {
    const b = document.getElementById('btn-back');
    if (b) b.disabled = !graphData || viewHistory.length === 0;
  }

  function goBackView() {
    if (!graphData || viewHistory.length === 0) return;
    const snap = viewHistory.pop();
    drillState = snap.drillState && typeof snap.drillState === 'object'
      ? JSON.parse(JSON.stringify(snap.drillState))
      : { mode: 'home' };
    isolatedSet = (snap.isolatedIds && snap.isolatedIds.length)
      ? new Set(snap.isolatedIds)
      : null;
    showRelationPanel(null);
    initGraph();
    updateBackButton();
  }

  const searchInput = document.getElementById('search-global');
  const searchSuggestEl = document.getElementById('search-suggestions');
  const searchAutocompleteWrap = document.getElementById('search-autocomplete-wrap');
  let searchSuggestDebounce = null;
  let searchSuggestActive = -1;
  let searchSuggestItems = [];
  const SEARCH_SUGGEST_LIMIT = 45;

  function hideSearchSuggestions() {
    searchSuggestActive = -1;
    searchSuggestItems = [];
    if (searchSuggestEl) {
      searchSuggestEl.hidden = true;
      searchSuggestEl.innerHTML = '';

  function searchSuggestionKindClass(kind) {
    if (kind === 'uzblock') return 'sk-uzblock';
    if (kind === 'cause') return 'sk-cause';
    if (kind === 'effect') return 'sk-effect';
    return 'sk-uzblock';

    if (kind === 'uzblock') return 'UZ';
    if (kind === 'cause') return 'Cause';
    if (kind === 'effect') return 'Effect';

  function updateSearchSuggestionsHighlight() {
    if (!searchSuggestEl) return;
    searchSuggestEl.querySelectorAll('.search-suggestion-item').forEach((el, i) => {
      el.classList.toggle('active', i === searchSuggestActive);
    });
  }

  function renderSearchSuggestions(items, showEmptyHint) {
    searchSuggestItems = items;
    if (!searchSuggestEl) return;
    if (!items.length) {
      searchSuggestActive = -1;
      if (showEmptyHint) {
        searchSuggestEl.innerHTML = '<div class="search-suggestion-empty" role="presentation">ไม่พบรายการที่ตรงกัน — ลองคำอื่น หรือกด &quot;ค้นหา&quot; เพื่อรวมทุกผลที่ตรง</div>';
        searchSuggestEl.hidden = false;
      } else {
        searchSuggestEl.hidden = true;
        searchSuggestEl.innerHTML = '';
      }
      return;
    }
    searchSuggestActive = 0;
    const hint = (items.length >= SEARCH_SUGGEST_LIMIT)
      ? '<div class="search-suggestion-hint" role="note">แสดงสูงสุด ' + SEARCH_SUGGEST_LIMIT + ' รายการ — กด &quot;ค้นหา&quot; เพื่อรวมทุกโหนดที่มีข้อความตรงกัน</div>'
      : '';
    searchSuggestEl.innerHTML = items.map((it, i) =>
      '<button type="button" class="search-suggestion-item' + (i === 0 ? ' active' : '') + '" data-index="' + i + '" role="option">' +
      '<span class="sk ' + searchSuggestionKindClass(it.kind) + '">' + escapeHtml(searchSuggestionKindShort(it.kind)) + '</span>' +
      '<span class="sl">' + escapeHtml(it.label) + '</span>' +
      '</button>'
    ).join('') + hint;
    searchSuggestEl.hidden = false;
    searchSuggestEl.querySelectorAll('.search-suggestion-item').forEach(btn => {
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
      btn.addEventListener('click', function () {
        const idx = parseInt(btn.getAttribute('data-index'), 10);
        if (!isNaN(idx) && searchSuggestItems[idx]) selectSearchSuggestion(searchSuggestItems[idx]);
      });
    });
  }

  function getSearchMatchEntries(q) {
    if (!graphData || !graphData.searchIndex || !graphData.searchIndex.length) return [];
    const qq = String(q || '').trim().toLowerCase();
    if (!qq) return [];
    const out = [];
    for (let i = 0; i < graphData.searchIndex.length; i++) {
      const e = graphData.searchIndex[i];
      if (!e || !e.text || e.text.indexOf(qq) === -1) continue;
      out.push({ id: e.id, kind: e.kind, label: e.label });
    }
    return out;
  }

  function refreshSearchSuggestions() {
    const q = (searchInput && searchInput.value || '').trim().toLowerCase();
    if (!graphData || !graphData.searchIndex) {
      hideSearchSuggestions();
      return;
    }
    if (!q) {
      hideSearchSuggestions();
      return;
    }
    const all = getSearchMatchEntries(q);
    const out = all.slice(0, SEARCH_SUGGEST_LIMIT);
    renderSearchSuggestions(out, true);
  }

  function applySearchFromMatchEntries(matchEntries) {
    if (!graphData || !matchEntries || !matchEntries.length) return false;
    pushNavHistory();
    const matched = new Set();
    matchEntries.forEach(x => {
      const n = graphData.nodeById.get(x.id);
      if (n) matched.add(x.id);
    });
    addUzBlockNodesForCausesInSet(graphData, matched);
    isolatedSet = matched;
    drillState = { mode: 'search' };
    hideSearchSuggestions();
    initGraph();
    return true;
  }

  function selectSearchSuggestion(item) {
    if (!item || !item.id) return;
    if (!applySearchFromMatchEntries([item])) return;
    if (searchInput) searchInput.value = item.label || '';
  }

  function handleGraphNodeClick(node, ev) {
    if (!graphData || !node) return;
    if (node.type === 'effect_bundle') return;

    const shiftDetail = ev && ev.shiftKey && node.type === 'effect';
    if (shiftDetail && drillState.mode !== 'effect_detail') {
      pushNavHistory();
      drillState = { mode: 'effect_detail', effectId: node.id };
      isolatedSet = null;
      showRelationPanel(node);
      initGraph();
      return;
    }

    if (drillState.mode === 'effect_detail') {
      if (node.type === 'detail_tag' || node.type === 'detail_desc') {
        const eff = graphData.nodeById.get(drillState.effectId);
        if (eff) showRelationPanel(eff);
      }
      return;
    }

    if (drillState.mode === 'effect_bridge') {
      if (node.type === 'effect') {
        pushNavHistory();
        drillState = { mode: 'effect_drill_up', effectId: node.id };
        isolatedSet = getEffectDrillUpSet(graphData, node.id);
        showRelationPanel(node);
        initGraph();
      }
      return;
    }

    if (drillState.mode === 'effect_next_uz') {
      if (node.type === 'effect' && drillState.effectId && node.id === drillState.effectId) {
        pushNavHistory();
        drillState = { mode: 'effect_drill_up', effectId: node.id };
        isolatedSet = getEffectDrillUpSet(graphData, node.id);
        showRelationPanel(node);
        initGraph();
        return;
      }
      if (node.type !== 'uzblock') return;
    }

    if (drillState.mode === 'search') {
      pushNavHistory();
      if (node.type === 'effect') {
        isolatedSet = getEffectDrillUpSet(graphData, node.id);
      } else if (node.type === 'cause') {
        isolatedSet = getOneStepNextSet(graphData, node.id);
      } else if (node.type === 'uzblock' && node.uzBlock) {
        drillState = { mode: 'uz', uzBlock: node.uzBlock, uzShowCauses: false };
        isolatedSet = getUzDrilldownSetEffectsOnly(graphData, node.uzBlock);
      } else {
        isolatedSet = getConnectedComponent(graphData, node.id);
      }
      showRelationPanel(node);
      initGraph();
      return;
    }

    if (drillState.mode === 'uz' && node.type === 'uzblock' && node.uzBlock
        && drillState.uzBlock === node.uzBlock && drillState.uzShowCauses === false) {
      pushNavHistory();
      drillState = { mode: 'uz', uzBlock: node.uzBlock, uzShowCauses: true };
      isolatedSet = getUzDrilldownSet(graphData, node.uzBlock);
      showRelationPanel(node);
      initGraph();
      return;
    }

    if (node.type === 'uzblock') {
      pushNavHistory();
      drillState = { mode: 'uz', uzBlock: node.uzBlock, uzShowCauses: false };
      isolatedSet = getUzDrilldownSetEffectsOnly(graphData, node.uzBlock);
      showRelationPanel(node);
      initGraph();
      return;
    }

    if (node.type === 'cause') {
      pushNavHistory();
      isolatedSet = getOneStepNextSet(graphData, node.id);
      showRelationPanel(node);
      initGraph();
      return;
    }

    if (node.type === 'effect') {
      pushNavHistory();
      // Effect_Tag = Cause_Tag ในแถวอื่น → แสดงโหนด Effect + UZ BLOCK ถัดไป แล้วคลิก UZ เพื่อดู Effect ต่อ (drill ซ้ำได้จนไม่มี Cause รับ tag นี้)
      const nextUz = getUzBlocksWhereEffectTagIsCause(graphData, node.id);
      if (nextUz.length > 0) {
        drillState = { mode: 'effect_next_uz', effectId: node.id };
        isolatedSet = new Set([node.id]);
        nextUz.forEach(ub => isolatedSet.add('uz_' + ub));
      } else if (effectHasOutgoingCauseLinks(graphData, node.id)) {
        drillState = { mode: 'effect_bridge', bridgeEffectId: node.id };
        isolatedSet = getEffectBridgeDrillSet(graphData, node.id);
      } else {
        drillState = { mode: 'effect_drill_up', effectId: node.id };
        isolatedSet = getEffectDrillUpSet(graphData, node.id);
      }
      showRelationPanel(node);
      initGraph();
      return;
    }
  }

  function initGraph() {
    actionLinkFocus = null;
    homeUzAmbientActive = false;
    container = document.getElementById('graph-container');
    if (graphInstance) {
      try {
        if (graphInstance.scene) graphInstance.scene().remove?.();
      } catch (e) {}
      graphInstance = null;
    }
    container.innerHTML = '';
    const data = getVisibleGraph();
    const initialView = noDirectionalParticlesView();
    lastNodeCount = data.nodes.length;
    lastVisibleGraphForLayout = { nodes: data.nodes, links: data.links || [] };
    function isHZNode(n) { return n.type === 'cause' && n.causeTag && n.causeTag.toUpperCase().includes('HZ'); }

    if (mode3d && typeof ForceGraph3D !== 'undefined') {
      const g = ForceGraph3D()(container)
        .backgroundColor('#000000')
        .graphData(data)
        .nodeLabel(nodeLabel)
        .nodeColor(nodeColor)
        .nodeVal(n => n.type === 'uzblock' ? 8 : n.type === 'cause' ? 4 : 3)
        .nodeThreeObject(n => {
          if (!isHZNode(n)) return null;
          if (typeof THREE === 'undefined') return null;
          const size = n.type === 'cause' ? 4 : 3;
          const hex = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1, 0.5, 6),
            new THREE.MeshLambertMaterial({ color: nodeColor(n) })
          );
          hex.scale.setScalar(size);
          return hex;
        })
        .linkDirectionalArrowLength(3)
        .linkDirectionalArrowRelPos(0.5)
        .linkWidth(1)
        .linkColor(linkColorDimAware)
        .onLinkClick((link, ev) => {
          try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch (e) {}
          setActionLinkFocusFromClick(link);
        })
        .onNodeClick((node, ev) => {
          handleGraphNodeClick(node, ev);
          if (graphInstance && graphInstance.zoomToFit) graphInstance.zoomToFit(400);
        })
        .onNodeHover((node, prev, ev) => {
          showTooltip(ev, node);
          container.style.cursor = node ? 'pointer' : 'default';
        })
        .onBackgroundClick(() => {
          clearActionLinkFocus();
          showRelationPanel(null);
        });
      applyLeftRightLayout(g, true, data.nodes.length, data.nodes, data.links);
      applyNodeSeparation(g, data.nodes.length, data.nodes, data.links);
      graphInstance = g;
    } else if (!mode3d && typeof ForceGraph !== 'undefined') {
      const g = ForceGraph()(container)
        .backgroundColor('#000000')
        .graphData(data)
        .nodeLabel('')
        .nodeColor(nodeColor)
        .nodeVal(n => n.type === 'uzblock' ? 8 : n.type === 'cause' ? 4 : n.type === 'detail_desc' ? 5 : n.type === 'effect_bundle' ? 2.2 : 3)
        .nodeCanvasObject((node, ctx, globalScale) => {
          const scale = globalScale || 1;
          const color = nodeColor(node);

          const roundRect = (x, y, w, h, r) => {
            const rr = Math.max(0, Math.min(r, Math.min(w, h) / 2));
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.arcTo(x + w, y, x + w, y + h, rr);
            ctx.arcTo(x + w, y + h, x, y + h, rr);
            ctx.arcTo(x, y + h, x, y, rr);
            ctx.arcTo(x, y, x + w, y, rr);
            ctx.closePath();
          };

          const fillBase = 'rgba(22,22,32,0.85)';
          const strokeBase = 'rgba(210,210,220,0.55)';
          ctx.save();

          if (node.type === 'cause') {
            const boxW = 310 / scale;
            const boxH = 78 / scale;
            const x = node.x - boxW / 2;
            const y = node.y - boxH / 2;
            const r = 14 / scale;

            roundRect(x, y, boxW, boxH, r);
            ctx.fillStyle = fillBase;
            ctx.fill();
            ctx.lineWidth = 2 / scale;
            ctx.strokeStyle = color || strokeBase;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            ctx.fillStyle = 'rgba(255,255,255,0.96)';
            ctx.font = (14 / scale) + 'px "Segoe UI", sans-serif';
            const title = node.causeTag || '-';
            ctx.fillText(title, node.x, y + 10 / scale);

            ctx.fillStyle = 'rgba(220,220,235,0.92)';
            ctx.font = (12 / scale) + 'px "Segoe UI", sans-serif';
            const descRaw = (node.causeDesc || '').replace(/\s+/g, ' ').trim();
            const descShort = descRaw.length > 70 ? (descRaw.slice(0, 67) + '...') : descRaw;
            const descY = y + 30 / scale;
            const descMaxW = boxW - 18 / scale;
            ctx.fillText(descShort, node.x, descY, descMaxW);
          } else if (node.type === 'detail_tag') {
            const boxW = 160 / scale;
            const boxH = 36 / scale;
            const x = node.x - boxW / 2;
            const y = node.y - boxH / 2;
            const r = 10 / scale;
            roundRect(x, y, boxW, boxH, r);
            ctx.fillStyle = fillBase;
            ctx.fill();
            ctx.lineWidth = 1.8 / scale;
            ctx.strokeStyle = color || strokeBase;
            ctx.stroke();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255,255,255,0.96)';
            ctx.font = (13 / scale) + 'px "Segoe UI", sans-serif';
            ctx.fillText(node.effectTag || node.name || '—', node.x, node.y);
          } else if (node.type === 'detail_desc') {
            const boxW = 340 / scale;
            const boxH = 88 / scale;
            const x = node.x - boxW / 2;
            const y = node.y - boxH / 2;
            const r = 12 / scale;
            roundRect(x, y, boxW, boxH, r);
            ctx.fillStyle = fillBase;
            ctx.fill();
            ctx.lineWidth = 2 / scale;
            ctx.strokeStyle = color || strokeBase;
            ctx.stroke();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.font = (13 / scale) + 'px "Segoe UI", sans-serif';
            const raw = (node.detailText || node.name || '—').replace(/\s+/g, ' ').trim();
            const short = raw.length > 120 ? raw.slice(0, 117) + '...' : raw;
            ctx.fillText(short, node.x, y + 14 / scale, boxW - 16 / scale);
          } else if (node.type === 'effect_bundle') {
            const rad = 16 / scale;
            ctx.beginPath();
            ctx.arc(node.x, node.y, rad, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(40,48,64,0.94)';
            ctx.fill();
            ctx.lineWidth = 2 / scale;
            ctx.strokeStyle = 'rgba(186,198,220,0.9)';
            ctx.stroke();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(248,250,252,0.95)';
            ctx.font = (9 / scale) + 'px "Segoe UI", sans-serif';
            const lab = String(node.bundleActionKey || '').slice(0, 7);
            ctx.fillText(lab, node.x, node.y);
          } else if (node.type === 'uzblock') {
            const tag = node.uzBlock || '-';
            const boxW = 140 / scale;
            const boxH = 32 / scale;
            const x = node.x - boxW / 2;
            const y = node.y - boxH / 2;
            const r = 10 / scale;

            roundRect(x, y, boxW, boxH, r);
            const homeStroke = isHomePageView() && node._homeLayoutX != null;
            const dimUz = actionLinkFocus && actionLinkFocus.nodeIds && !actionLinkFocus.nodeIds.has(node.id);
            ctx.fillStyle = (homeStroke && dimUz) ? 'rgba(46,46,54,0.88)' : fillBase;
            ctx.fill();
            if (homeStroke) {
              const st = dimUz ? { stroke: 'rgba(88,88,100,0.32)', lw: 1.35 } : { stroke: 'rgba(30, 64, 175, 0.94)', lw: 1.85 };
              ctx.lineWidth = st.lw / scale;
              ctx.strokeStyle = st.stroke;
            } else {
              ctx.lineWidth = 1.6 / scale;
              ctx.strokeStyle = color || strokeBase;
            }
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = (homeStroke && dimUz) ? 'rgba(168,168,182,0.55)' : 'rgba(255,255,255,0.95)';
            ctx.font = (12 / scale) + 'px "Segoe UI", sans-serif';
            ctx.fillText(tag, node.x, node.y);

            // Drilldown view: show UZ BLOCK_Description below UZ node.
            if (!isHomePageView() && node.uzDesc) {
              const descRaw = String(node.uzDesc).replace(/\s+/g, ' ').trim();
              const descShort = descRaw.length > 72 ? (descRaw.slice(0, 69) + '...') : descRaw;
              const descY = y + boxH + 6 / scale;
              ctx.textBaseline = 'top';
              ctx.fillStyle = 'rgba(205,215,240,0.92)';
              ctx.font = (10.5 / scale) + 'px "Segoe UI", sans-serif';
              ctx.fillText(descShort, node.x, descY, 220 / scale);
            }
          } else {
            // Small tags for Effect / others
            const tag = (node.type === 'effect') ? (node.effectTag || '-') : (node.name || node.id);
            const isEffect = node.type === 'effect';
            const actionFocusOut = actionLinkFocus && actionLinkFocus.nodeIds && !actionLinkFocus.nodeIds.has(node.id);
            const showHsResetBox = isEffect && effectHasHsResetFromCause(node) && !actionFocusOut;
            const bridgeCrossUz = isEffect && !actionFocusOut && graphData && effectTagIsCauseInOtherUzBlock(graphData, node);

            const boxW = 140 / scale;
            const boxH = 32 / scale;
            const x = node.x - boxW / 2;
            const y = node.y - boxH / 2;
            const r = 10 / scale;

            roundRect(x, y, boxW, boxH, r);
            ctx.fillStyle = (isEffect && actionFocusOut) ? 'rgba(46,46,54,0.88)' : fillBase;
            ctx.fill();
            ctx.lineWidth = bridgeCrossUz ? (2.75 / scale) : (1.6 / scale);
            ctx.strokeStyle = bridgeCrossUz ? '#ef4444' : (color || strokeBase);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = (isEffect && actionFocusOut) ? 'rgba(168,168,182,0.55)' : 'rgba(255,255,255,0.95)';
            ctx.font = (12 / scale) + 'px "Segoe UI", sans-serif';
            ctx.fillText(tag, node.x, node.y);

            // HS + Reset_* ใน E1..E21: ปุ่ม Hand switch Reset วาล์ว → Reset box ข้าง Effect (ไม่มีเส้น HS→Effect สำหรับ Reset)
            if (showHsResetBox) {
              const bW = 56 / scale;
              const bH = 22 / scale;
              const bx = x + boxW + 8 / scale;
              const by = y - 8 / scale;
              roundRect(bx, by, bW, bH, 7 / scale);
              ctx.fillStyle = 'rgba(217,249,157,0.22)';
              ctx.fill();
              ctx.lineWidth = 1.3 / scale;
              ctx.strokeStyle = '#d9f99d';
              ctx.stroke();
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#d9f99d';
              ctx.font = (11 / scale) + 'px "Segoe UI", sans-serif';
              ctx.fillText('Reset', bx + bW / 2, by + bH / 2);
            }
          }

          ctx.restore();
        })
        .linkDirectionalArrowLength(4)
        .linkDirectionalArrowRelPos(0.56)
        .linkWidth(linkWidthForGraph)
        .linkCurvature(link => {
          if (link.type === 'detail-link') return 0;
          if (link.type === 'effect_bundle_out') return 0;
          if (link.type === 'effect_bundle_in') return 0.06;
          const sa = typeof link.source === 'object' ? link.source.id : link.source;
          const ta = typeof link.target === 'object' ? link.target.id : link.target;
          const key = String(sa) + '\0' + String(ta) + '\0' + String(link.type || '');
          let h = 2166136261;
          for (let i = 0; i < key.length; i++) {
            h ^= key.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          const u = (Math.abs(h) % 10001) / 10000;
          return (u - 0.5) * 0.38;
        })
        .linkColor(linkColorDimAware)
        .onLinkClick((link, ev) => {
          try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch (e) {}
          setActionLinkFocusFromClick(link);
        })
        .onBackgroundClick(() => {
          clearActionLinkFocus();
          showRelationPanel(null);
        })
        .onNodeClick((node, ev) => {
          handleGraphNodeClick(node, ev);
        })
        .onNodeHover((node, prev, ev) => {
          showTooltip(ev, node);
          container.style.cursor = node ? 'pointer' : 'default';
        });
      // freeze simulation เพื่อกันความหน่วง โดยยังให้ interactions ทำงานต่อได้
      if (typeof g.cooldownTicks === 'function') {
        let ticks = initialView ? 280 : Math.min(420 + Math.floor((data.nodes.length || 0) * 0.85), 820);
        if (isHomeUzOverview(data.nodes, data.links)) {
          ticks = Math.min(200, Math.max(96, 72 + Math.floor((data.nodes.length || 0) * 5)));
        }
        g.cooldownTicks(ticks);
      }
      applyLeftRightLayout(g, false, data.nodes.length, data.nodes, data.links);
      applyNodeSeparation(g, data.nodes.length, data.nodes, data.links);
      applyRelatedUzLeftOfSelectedForce(g, data.nodes.length, data.nodes, data.links);
      if (isHomeUzOverview(data.nodes, data.links)) {
        if (typeof g.autoPauseRedraw === 'function') g.autoPauseRedraw(false);
        if (typeof g.onEngineStop === 'function') {
          g.onEngineStop(() => {
            if (graphInstance === g && isHomePageView()) homeUzAmbientActive = true;
          });
        }
        if (typeof g.onRenderFramePre === 'function') {
          g.onRenderFramePre(() => {
            if (homeUzAmbientActive && graphInstance === g) applyHomeUzAmbientDrawOffset();
          });
        }
      }
      graphInstance = g;
    } else {
      const ForceGraph = typeof ForceGraph3D !== 'undefined' ? ForceGraph3D : (typeof ForceGraph !== 'undefined' ? ForceGraph : null);
      if (ForceGraph) {
        const g = ForceGraph()(container)
          .backgroundColor('#000000')
          .graphData(data)
          .nodeLabel(nodeLabel)
          .nodeColor(nodeColor)
          .nodeVal(n => n.type === 'uzblock' ? 8 : 4)
          .linkDirectionalArrowLength(3)
          .linkWidth(1)
          .linkColor(linkColorDimAware)
          .onLinkClick((link, ev) => {
            try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch (e) {}
            setActionLinkFocusFromClick(link);
          })
          .onBackgroundClick(() => {
            clearActionLinkFocus();
            showRelationPanel(null);
          })
          .onNodeClick((node, ev) => {
            handleGraphNodeClick(node, ev);
            if (graphInstance && graphInstance.zoomToFit) graphInstance.zoomToFit(400);
          })
          .onNodeHover((node, prev, ev) => {
            showTooltip(ev, node);
            container.style.cursor = node ? 'pointer' : 'default';
          });
        applyLeftRightLayout(g, true, data.nodes.length, data.nodes, data.links);
        applyNodeSeparation(g, data.nodes.length, data.nodes, data.links);
        applyRelatedUzLeftOfSelectedForce(g, data.nodes.length, data.nodes, data.links);
        graphInstance = g;
      }
    }
    if (!linkDistanceListenerAttached) {
      linkDistanceListenerAttached = true;
      const distEl = document.getElementById('link-distance');
      if (distEl) distEl.addEventListener('change', function () {
        const gd = graphInstance && typeof graphInstance.graphData === 'function' ? graphInstance.graphData() : null;
        const ns = (gd && gd.nodes) || lastVisibleGraphForLayout.nodes;
        const ls = (gd && gd.links) || lastVisibleGraphForLayout.links;
        const nc = (ns && ns.length) || lastNodeCount || 1;
        if (isHomeUzOverview(ns, ls)) {
          if (graphInstance) refreshHomeUzLayoutForces(graphInstance, ns, ls);
        } else if (graphInstance && typeof graphInstance.dagLevelDistance === 'function') {
          graphInstance.dagLevelDistance(computeDagLevelDistancePx(nc, ns, ls));
        }
        if (graphInstance) applyNodeSeparation(graphInstance, nc, ns, ls);
        if (graphInstance) applyRelatedUzLeftOfSelectedForce(graphInstance, nc, ns, ls);
      });
    }
    if (!layoutResizeListenerAttached) {
      layoutResizeListenerAttached = true;
      window.addEventListener('resize', function () {
        clearTimeout(layoutResizeTimer);
        layoutResizeTimer = setTimeout(function () {
          if (!graphInstance || typeof graphInstance.graphData !== 'function') return;
          const gd = graphInstance.graphData();
          const ns = (gd && gd.nodes) || [];
          const ls = (gd && gd.links) || [];
          const nc = ns.length || lastNodeCount || 1;
          if (isHomeUzOverview(ns, ls)) {
            refreshHomeUzLayoutForces(graphInstance, ns, ls);
          } else if (typeof graphInstance.dagLevelDistance === 'function') {
            graphInstance.dagLevelDistance(computeDagLevelDistancePx(nc, ns, ls));
          }
          applyNodeSeparation(graphInstance, nc, ns, ls);
          applyRelatedUzLeftOfSelectedForce(graphInstance, nc, ns, ls);
          bumpZoomToFit();
        }, 180);
      });
    }
    if (graphInstance) {
      graphInstance.nodeColor(nodeColor);
      graphInstance.nodeLabel('');
      if (typeof graphInstance.linkColor === 'function') graphInstance.linkColor(linkColorDimAware);
    }
    bumpZoomToFit();
    syncUzBlockDropdown();
  }

  function runWithFile(file) {
    const isExcel = /\.xlsx?$/i.test(file.name);
    const load = isExcel ? parseExcelFile(file) : parseCSVFile(file);
    load.then(rows => {
      graphData = buildGraphFromRows(rows);
      isolatedSet = null;
      drillState = { mode: 'home' };
      clearNavHistory();
      hideSearchSuggestions();
      populateUzBlockDropdown();
      initGraph();
    }).catch(err => {
      alert('ไม่สามารถโหลดไฟล์ได้: ' + err.message);
    });
  }

  document.getElementById('file-input').addEventListener('change', function () {
    const f = this.files[0];
    if (f) runWithFile(f);
  });

  document.getElementById('uz-block-select').addEventListener('change', function () {
    const v = this.value;
    if (!graphData || !v) return;
    pushNavHistory();
    drillState = { mode: 'uz', uzBlock: v, uzShowCauses: false };
    isolatedSet = getUzDrilldownSetEffectsOnly(graphData, v);
    const uzNode = graphData.nodeById.get('uz_' + v);
    showRelationPanel(uzNode || null);
    initGraph();
  });

  document.getElementById('btn-search').addEventListener('click', function () {
    const q = (searchInput && searchInput.value || '').trim().toLowerCase();
    if (!q || !graphData) return;
    const matched = getSearchMatchEntries(q);
    if (matched.length) {
      applySearchFromMatchEntries(matched);
    } else {
      alert('ไม่พบ: ' + q);
      hideSearchSuggestions();
    }
  });

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      clearTimeout(searchSuggestDebounce);
      searchSuggestDebounce = setTimeout(refreshSearchSuggestions, 160);
    });
    searchInput.addEventListener('focus', function () {
      if ((searchInput.value || '').trim()) refreshSearchSuggestions();
    });
    searchInput.addEventListener('keydown', function (e) {
      const panelOpen = searchSuggestEl && !searchSuggestEl.hidden;
      const n = searchSuggestItems.length;
      if (e.key === 'Escape') {
        if (panelOpen) {
          e.preventDefault();
          hideSearchSuggestions();
        }
        return;
      }
      if (panelOpen && n && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        if (e.key === 'ArrowDown') {
          searchSuggestActive = (searchSuggestActive + 1) % n;
        } else {
          searchSuggestActive = (searchSuggestActive <= 0 ? n - 1 : searchSuggestActive - 1);
        }
        updateSearchSuggestionsHighlight();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (panelOpen && n && searchSuggestActive >= 0 && searchSuggestItems[searchSuggestActive]) {
          selectSearchSuggestion(searchSuggestItems[searchSuggestActive]);
        } else {
          document.getElementById('btn-search').click();
        }
      }
    });
  }

  document.addEventListener('click', function (e) {
    if (!searchAutocompleteWrap || !e.target) return;
    if (!searchAutocompleteWrap.contains(e.target)) hideSearchSuggestions();
  });

  document.getElementById('btn-home').addEventListener('click', function () {
    isolatedSet = null;
    drillState = { mode: 'home' };
    clearNavHistory();
    showRelationPanel(null);
    if (graphData) initGraph();
  });

  document.getElementById('btn-back').addEventListener('click', function () {
    goBackView();
  });

  document.getElementById('btn-reset-view').addEventListener('click', function () {
    isolatedSet = null;
    drillState = { mode: 'home' };
    clearNavHistory();
    showRelationPanel(null);
    if (graphData) initGraph();
  });

  document.getElementById('btn-reset-isolate').addEventListener('click', function () {
    isolatedSet = null;
    drillState = { mode: 'home' };
    clearNavHistory();
    if (graphData) initGraph();
  });

  document.addEventListener('mousemove', function (e) {
    lastPointer.x = e.pageX;
    lastPointer.y = e.pageY;
  });

  console.log('CED Cause & Effect Graph ready. Upload CSV or Excel.');
})();
  </script>
</body>
</html>
