<!DOCTYPE html>
<html lang="th" style="background:#000000!important;background-color:#000000!important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CED Cause & Effect Graph</title>
  <style>
    * { box-sizing: border-box; }
    /* สีดำคงที่ — ใช้ !important เพื่อไม่ให้ธีม SharePoint / parent page ทับ */
    html, body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000 !important;
      background-color: #000000 !important;
      color: #e0e0e0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .app-header {
      flex-shrink: 0;
      background: #111118;
      border-bottom: 1px solid #2a2a36;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 8px;
    }
    .brand-mark {
      width: 10px;
      height: 28px;
      border-radius: 3px;
      background: #6b8cff;
      flex-shrink: 0;
    }
    .brand-copy {
      min-width: 0;
      flex: 1;
    }
    .brand-copy h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.01em;
      color: #f3f4f8;
      line-height: 1.25;
    }
    .brand-copy p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #8b8b9c;
      line-height: 1.3;
    }
    .header-contact {
      margin-left: auto;
      font-size: 11px;
      color: #7a7a8c;
      white-space: nowrap;
    }
    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      padding: 0 16px 10px;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .ctrl-group.grow { flex: 1 1 280px; min-width: 220px; }
    .ctrl-sep {
      width: 1px;
      height: 22px;
      background: #2e2e3c;
      flex-shrink: 0;
    }
    .app-header label.field-label {
      margin: 0;
      font-size: 11px;
      color: #9a9aac;
      white-space: nowrap;
    }
    .app-header input[type="file"] { display: none; }
    .app-header button, .app-header .btn, .app-header a.btn-link {
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid #343446;
      background: #1c1c28;

      cursor: pointer;
      font-size: 12px;

    .app-header button:hover, .app-header .btn:hover, .app-header a.btn-link:hover {
      background: #27273a;
      border-color: #4a4a62;
    }
    .app-header button:disabled { opacity: 0.42; cursor: not-allowed; }
    .app-header .btn-primary {
      background: #2a3a78;
      border-color: #3d56b8;
      color: #eef2ff;
    }
    .app-header .btn-primary:hover { background: #334790; }
    .app-header input[type="text"], .app-header input[type="number"], .app-header select {
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid #343446;
      background: #16161f;

      font-size: 12px;
    }
    .app-header input[type="text"] { width: min(260px, 100%); }
    .app-header select {
      min-width: 200px;
      max-width: min(420px, 46vw);
    }
    .header-legend {
      display: flex;

      align-items: center;

      padding: 7px 16px;

    .header-legend .hint { color: #8e8ea0; }

    .search-autocomplete-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-autocomplete-wrap .search-input-row { display: flex; gap: 6px; align-items: center; }
    #graph-container {
      width: 100%;
      flex: 1 1 auto;
      min-height: 360px;
      height: auto;
      background: #000000 !important;
      background-color: #000000 !important;
    }
    #tooltip {
      position: fixed; max-width: 380px; padding: 10px 12px; background: #1e1e2a;
      border: 1px solid #3a3a4a; border-radius: 8px; pointer-events: none;

      display: none;

    #tooltip .tt-desc { color: #c8c8d0; word-break: break-word; line-height: 1.45; }
    #relation-panel {
      position: fixed; right: 12px; bottom: 12px; max-width: min(760px, 96vw); max-height: min(440px, 55vh);
      background: #1a1a24; border: 1px solid #3a3a4a; border-radius: 8px;

    #relation-panel .rel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

      background: #252532; color: #e0e0e0; cursor: pointer;
      font-size: 12px; line-height: 1; flex-shrink: 0;
    }
    #relation-panel .rel-minimize-btn:hover { background: #32324a; }
    #relation-panel.minimized {
      max-height: 52px;
      overflow: hidden;
      padding-bottom: 10px;
    }
    #relation-panel.minimized #relation-table-wrap { display: none; }
    #relation-panel table { width: 100%; border-collapse: collapse; }
    #relation-panel th, #relation-panel td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2a38; }
    #relation-panel th { color: #888; font-weight: 600; }
    #relation-panel .rel-section-title { margin: 10px 0 6px 0; color: #8eb4ff; font-size: 12px; font-weight: 600; }
    #relation-panel .rel-meta td { color: #c8c8d8; word-break: break-word; line-height: 1.4; }
    #relation-panel .rel-ce th, #relation-panel .rel-ce td { font-size: 11px; vertical-align: top; word-break: break-word; line-height: 1.35; }
    #relation-panel .rel-ce th { white-space: nowrap; }
    #relation-panel .rel-empty { color: #777; font-size: 11px; margin: 6px 0 0 0; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 4px 0; font-size: 12px; align-items: center; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .legend-hints {
      width: 100%;
      display: flex; gap: 22px; flex-wrap: wrap; align-items: center;
      padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid #2e2e3c;
      font-size: 11px; color: #c8c8dc; font-weight: 500;
    }
    .search-autocomplete-wrap { position: relative; }
    .search-autocomplete-wrap .search-input-row { display: flex; gap: 6px; align-items: center; }
    .search-suggestions {
      position: absolute; left: 0; top: 100%; margin-top: 4px; min-width: min(520px, 92vw);
      max-height: 280px; overflow-y: auto; background: #1e1e2a; border: 1px solid #3a3a4a;
      border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.45); z-index: 2000;
      padding: 4px 0;
    }
    .search-suggestions[hidden] { display: none !important; }
    .search-suggestion-item {
      display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left;
      padding: 8px 12px; border: none; background: transparent; color: #e8e8f0;
      cursor: pointer; font-size: 12px; line-height: 1.35; border-left: 3px solid transparent;
    }
    .search-suggestion-item:hover, .search-suggestion-item.active {
      background: #2a2a3c;
    }
    .search-suggestion-item.active { border-left-color: #6b8cff; }
    .search-suggestion-item .sk {
      flex-shrink: 0; font-size: 10px; font-weight: 700; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; margin-top: 1px;
    }
    .sk-uzblock { background: #3d4f9e; color: #dbe4ff; }
    .sk-cause { background: #166534; color: #bbf7d0; }
    .sk-effect { background: #92400e; color: #fde68a; }
    .search-suggestion-item .sl { word-break: break-word; }
    .search-suggestion-empty { padding: 10px 14px; color: #888; font-size: 12px; }
    .search-suggestion-hint { font-size: 11px; color: #6a6a78; padding: 8px 12px; border-top: 1px solid #2a2a38; line-height: 1.35; }
  </style>

  <!-- SheetJS for Excel (optional - only needed for .xlsx) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- d3: collision + charge tuning -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <!-- force-graph 2D (vasturiano) - UMD -->
  <script src="https://cdn.jsdelivr.net/npm/force-graph/dist/force-graph.min.js"></script>

  <script>
(function () {
  'use strict';

  const TAG_PATTERN = /^\d+-[A-Z0-9]+\s*-\s*[\w\/\s]+$/i;

  function parseEffectCell(text) {
    if (!text || typeof text !== 'string') return null;
    const t = text.trim();
    const parts = t.split('_');
    if (parts.length < 2) return null;
    const action = parts[0];
    // Support both:
    // 1) Action_EffectTag_Description
    // 2) Reset_EffectTag
    // If description is missing, keep empty string.
    for (let i = 1; i < parts.length - 1; i++) {
      const seg = parts[i].trim();
      if (TAG_PATTERN.test(seg)) {
        const desc = parts.slice(i + 1).join('_').trim();
        return { action, effectTag: seg, description: desc, raw: t };
      }
    }
    // Case: only two segments, e.g. Reset_107-UZ-131A/B
    const seg2 = parts[1].trim();
    if (TAG_PATTERN.test(seg2)) {
      const desc2 = parts.slice(2).join('_').trim();
      return { action, effectTag: seg2, description: desc2, raw: t };
    }
    return null;
  }

  function normalizeTag(t) {
    if (!t) return '';
    return String(t).trim().replace(/\s+/g, ' ');
  }

  function searchLabelForNode(n) {
    const trim = (s, max) => {
      if (s == null || s === '') return '';
      s = String(s).replace(/\s+/g, ' ').trim();
      return s.length > max ? s.slice(0, Math.max(0, max - 1)) + '…' : s;
    };
    if (n.type === 'uzblock') return 'UZ BLOCK — ' + trim(n.uzBlock, 48);
    if (n.type === 'cause') {
      return 'Cause — ' + trim(n.causeTag, 36) + (n.causeDesc ? ' · ' + trim(n.causeDesc, 64) : '');
    }
    if (n.type === 'effect') {
      const d = (n.effectDescs && n.effectDescs.length) ? n.effectDescs.join(' ') : (n.effectDesc || '');
      return 'Effect — ' + trim(n.effectTag, 36) + (d ? ' · ' + trim(d, 64) : '');
    }
    return trim(n.name || n.id, 96);
  }

  function parseCSV(text) {
    const rows = [];
    let i = 0;
    while (i < text.length) {
      const row = [];
      while (i < text.length) {
        if (text[i] === '"') {
          i++;
          let cell = '';
          while (i < text.length && text[i] !== '"') {
            if (text[i] === '\\') { i++; if (i < text.length) cell += text[i++]; }
            else cell += text[i++];
          }
          if (text[i] === '"') i++;
          row.push(cell);
        } else {
          let cell = '';
          while (i < text.length && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') cell += text[i++];
          row.push(cell.trim());
        }
        if (i < text.length && (text[i] === '\n' || text[i] === '\r')) {
          if (text[i] === '\r' && text[i + 1] === '\n') i += 2;
          else i++;
          break;
        }
        if (i < text.length && text[i] === ',') i++;
      }
      if (row.some(c => c !== '')) rows.push(row);
    }
    return rows;
  }

  /** ชื่อไฟล์ Excel ที่วางไว้ในโฟลเดอร์เดียวกับ index.html (สำเนาจาก CED PROJECT) — ใช้กับปุ่ม/โหลดอัตโนมัติ */
  const DEFAULT_BUNDLED_XLSX = 'CED 106&107 - Copy - Copy.xlsx';

  function parseExcelArrayBuffer(arrayBuffer) {
    const wb = XLSX.read(arrayBuffer, { type: 'array', raw: true });
    const first = wb.SheetNames[0];
    let sheet = wb.Sheets[first];
    for (const n of wb.SheetNames) {
      const s = wb.Sheets[n];
      const a = XLSX.utils.sheet_to_json(s, { header: 1 });
      if (a.length && a[0] && a[0].some(c => String(c).indexOf('UZ BLOCK') !== -1 || String(c).indexOf('Cause_Tag') !== -1)) {
        sheet = s;
        break;
      }
    }
    return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  }

  function parseExcelFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = function () {
        try {
          resolve(parseExcelArrayBuffer(r.result));
        } catch (e) {
          reject(e);
        }
      };
      r.onerror = () => reject(new Error('Cannot read file'));
      r.readAsArrayBuffer(file);
    });
  }

  function parseCSVFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = function () {
        const text = r.result;
        const rows = parseCSV(text);
        resolve(rows);
      };
      r.onerror = () => reject(new Error('Cannot read file'));
      r.readAsText(file, 'UTF-8');
    });
  }

  function buildGraphFromRows(rows) {
    if (!rows.length || !rows[0]) return { nodes: [], links: [] };
    const header = rows[0].map(c => String(c).trim());
    const idx = {
      causeDesc: header.indexOf('Cause_Description'),
      causeTag: header.indexOf('Cause_Tag Number'),
      causeFunc: header.indexOf('Cause_Function'),
      uzBlock: header.indexOf('UZ BLOCK'),
      uzBlockDesc: header.indexOf('UZ BLOCK_Description'),
    };
    const eCols = [];
    for (let j = 0; j < header.length; j++) {
      if (/^E\d+$/.test(header[j])) eCols.push(j);
    }
    if (idx.causeTag < 0 || idx.uzBlock < 0) {
      console.warn('Expected columns: Cause_Tag Number, UZ BLOCK');
      return { nodes: [], links: [] };
    }

    const nodes = [];
    const links = [];
    const nodeById = new Map();
    const causeTagToNodeIds = new Map();
    const effectTagToNodeIds = new Map();
    const uzBlocks = new Set();
    const rowByCause = new Map();
    const uzBlockDescByBlock = new Map();

    function safeEffectId(tag) {
      return 'eff_' + normalizeTag(tag).replace(/\s+/g, '').replace(/\//g, '-');
    }

    function addNode(id, name, type, data) {
      if (nodeById.has(id)) return nodeById.get(id);
      const n = { id, name, type, ...data };
      nodes.push(n);
      nodeById.set(id, n);
      return n;
    }

    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const uzBlock = normalizeTag(row[idx.uzBlock]);
      const uzBlockDesc = (idx.uzBlockDesc >= 0 && row[idx.uzBlockDesc] != null) ? String(row[idx.uzBlockDesc]).trim() : '';
      const causeTag = normalizeTag(row[idx.causeTag]);
      const causeDesc = (row[idx.causeDesc] != null) ? String(row[idx.causeDesc]).trim() : '';
      const causeFunc = (row[idx.causeFunc] != null) ? String(row[idx.causeFunc]).trim() : '';
      if (!uzBlock || !causeTag) continue;

      uzBlocks.add(uzBlock);
      if (uzBlockDesc) {
        if (!uzBlockDescByBlock.has(uzBlock)) uzBlockDescByBlock.set(uzBlock, new Set());
        uzBlockDescByBlock.get(uzBlock).add(uzBlockDesc);
      }
      const blockId = 'uz_' + uzBlock;
      addNode(blockId, uzBlock, 'uzblock', { uzBlock, causeTag: '', effectTag: '', description: '' });

      const causeId = 'cause_' + causeTag + '_' + r;
      addNode(causeId, causeTag, 'cause', {
        causeTag, causeDesc, causeFunc, uzBlock, rowIndex: r, effectTag: '',
        description: causeDesc || causeTag,
      });
      if (!causeTagToNodeIds.has(causeTag)) causeTagToNodeIds.set(causeTag, []);
      causeTagToNodeIds.get(causeTag).push(causeId);
      rowByCause.set(causeId, { row, idx, eCols, r });

      links.push({ source: blockId, target: causeId, type: 'contains' });

      for (let ei = 0; ei < eCols.length; ei++) {
        const col = eCols[ei];
        const cell = row[col];
        const parsed = parseEffectCell(cell);
        if (!parsed) continue;
        const effectTagNorm = normalizeTag(parsed.effectTag);
        const effectId = safeEffectId(parsed.effectTag);
        let effectNode = nodeById.get(effectId);
        if (!effectNode) {
          effectNode = addNode(effectId, parsed.effectTag, 'effect', {
            effectTag: parsed.effectTag,
            effectActions: [],
            effectDescs: [],
            fromCauses: [],
            uzBlock: '',
            causeTag: '',
            description: '',
          });
          effectNode.effectActions = [];
          effectNode.effectDescs = [];
          effectNode.fromCauses = [];
          if (!effectTagToNodeIds.has(effectTagNorm)) effectTagToNodeIds.set(effectTagNorm, []);
          effectTagToNodeIds.get(effectTagNorm).push(effectId);
        }
        effectNode.effectActions.push(parsed.action);
        effectNode.effectDescs.push(parsed.description);
        effectNode.fromCauses.push({ causeTag, causeId, action: parsed.action, effectDesc: parsed.description });
        links.push({ source: causeId, target: effectId, type: 'effect', effectTag: parsed.effectTag, effectAction: parsed.action });
      }
    }

    for (const link of links.slice()) {
      if (link.type !== 'effect') continue;
      const effectTag = link.effectTag;
      const targetCauseIds = causeTagToNodeIds.get(normalizeTag(effectTag));
      if (!targetCauseIds) continue;
      const effectId = typeof link.target === 'object' ? link.target.id : link.target;
      for (const targetId of targetCauseIds) {
        if (targetId === link.source) continue;
        links.push({
          source: effectId,
          target: targetId,
          type: 'cause-link',
          effectTag,
          effectAction: link.effectAction,
        });
      }
    }

    const blockLinks = [];
    const blockPairDone = new Set();
    for (const link of links) {
      if (link.type !== 'cause-link') continue;
      const effectNode = nodeById.get(link.source);
      const tgt = nodeById.get(link.target);
      if (!effectNode || !tgt || tgt.type !== 'cause') continue;
      const blockB = tgt.uzBlock;
      (effectNode.fromCauses || []).forEach(fc => {
        const causeA = nodeById.get(fc.causeId);
        if (!causeA || !causeA.uzBlock || causeA.uzBlock === blockB) return;
        const key = causeA.uzBlock + '->' + blockB;
        if (blockPairDone.has(key)) return;
        blockPairDone.add(key);
        blockLinks.push({
          source: 'uz_' + causeA.uzBlock,
          target: 'uz_' + blockB,
          type: 'block-link',
        });
      });
    }

    const uzBlockDescs = new Map();
    nodes.forEach(n => {
      if (n.type === 'cause' && n.uzBlock && n.causeDesc) {
        if (!uzBlockDescs.has(n.uzBlock)) uzBlockDescs.set(n.uzBlock, new Set());
        uzBlockDescs.get(n.uzBlock).add(n.causeDesc);
      }
    });
    uzBlockDescByBlock.forEach((v, k) => uzBlockDescs.set(k, v));
    nodes.forEach(n => {
      if (n.type === 'uzblock' && n.uzBlock) {
        const s = uzBlockDescs.get(n.uzBlock);
        n.uzDesc = s ? Array.from(s).join(' ; ').substring(0, 600) : '';
      }
    });

    function buildSearchIndex(g) {
      const index = [];
      g.nodes.forEach(n => {
        const parts = [];
        if (n.causeTag) parts.push(n.causeTag);
        if (n.effectTag) parts.push(n.effectTag);
        if (n.uzBlock) parts.push(n.uzBlock);
        if (n.uzDesc) parts.push(n.uzDesc);
        if (n.causeDesc) parts.push(n.causeDesc);
        if (n.effectDescs && n.effectDescs.length) parts.push(n.effectDescs.join(' '));
        else if (n.effectDesc) parts.push(n.effectDesc);
        if (n.effectActions && n.effectActions.length) parts.push(n.effectActions.join(' '));
        if (n.causeFunc) parts.push(n.causeFunc);
        if (n.name) parts.push(n.name);
        if (n.fromCauses && n.fromCauses.length) n.fromCauses.forEach(fc => { parts.push(fc.causeTag, fc.effectDesc || ''); });
        index.push({
          id: n.id,
          text: parts.join(' ').toLowerCase(),
          label: searchLabelForNode(n),
          kind: n.type || '',
        });
      });
      return index;
    }

    const graph = { nodes, links, blockLinks, nodeById, causeTagToNodeIds, effectTagToNodeIds, uzBlocks, searchIndex: buildSearchIndex({ nodes }) };
    return graph;
  }

  function buildAdjacency(graph) {
    const adj = new Map();
    function addEdge(a, b) {
      if (!a || !b) return;
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b);
      adj.get(b).push(a);
    }
    graph.links.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      addEdge(s, t);
    });
    (graph.blockLinks || []).forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      addEdge(s, t);
    });
    return adj;
  }

  function getConnectedComponent(graph, startNodeId) {
    const out = new Set();
    if (!startNodeId || !graph.nodeById.has(startNodeId)) return out;
    const adj = buildAdjacency(graph);
    const q = [startNodeId];
    out.add(startNodeId);
    while (q.length) {
      const id = q.shift();
      const nbrs = adj.get(id) || [];
      for (let i = 0; i < nbrs.length; i++) {
        const w = nbrs[i];
        if (!out.has(w)) {
          out.add(w);
          q.push(w);
        }
      }
    }
    return out;
  }

  function linkNorm(l, which) {
    const x = which === 's' ? l.source : l.target;
    return typeof x === 'object' ? x.id : x;
  }

  /**
   * UZ ที่เลือก: โหนด UZ + Cause/Effect ภายใน UZ นั้น
   * + โหนด UZ ต้นทางที่ block-link เข้ามา (Effect จาก UZ อื่น → Cause ใน UZ นี้) เพื่อให้เห็น UZ ที่ “สั่งงาน” เข้ามา โดยไม่ดึง Effect ทั้งหมดของ UZ ต้นทาง
   */
  function getUzDrilldownSet(graph, uzBlockKey) {
    const ids = new Set();
    const uzId = 'uz_' + uzBlockKey;
    if (!graph.nodeById.has(uzId)) return ids;
    ids.add(uzId);

    const causesInUz = [];
    graph.nodes.forEach(n => {
      if (n.type === 'cause' && n.uzBlock === uzBlockKey) {
        ids.add(n.id);
        causesInUz.push(n.id);
      }
    });

    const causeSet = new Set(causesInUz);
    graph.links.forEach(l => {
      if (l.type !== 'effect') return;
      const s = linkNorm(l, 's');
      if (!causeSet.has(s)) return;
      ids.add(linkNorm(l, 't'));
    });

    (graph.blockLinks || []).forEach(bl => {
      const t = linkNorm(bl, 't');
      if (t !== uzId) return;
      const s = linkNorm(bl, 's');
      if (s && graph.nodeById.has(s)) ids.add(s);
    });

    addDownstreamCauseUzFromEffectLinks(graph, ids);
    return ids;
  }

  /** มุมมองแรกของ UZ: ไม่ใส่ Cause ใน set — แสดงเฉพาะ UZ + Effect (ลากเส้นสังเคราะห์ UZ→Effect ใน getVisibleGraph) + UZ ต้นทางจาก block-link */
  function getUzDrilldownSetEffectsOnly(graph, uzBlockKey) {
    const ids = new Set();
    const uzId = 'uz_' + uzBlockKey;
    if (!graph.nodeById.has(uzId)) return ids;
    ids.add(uzId);

    const causesInUz = [];
    graph.nodes.forEach(n => {
      if (n.type === 'cause' && n.uzBlock === uzBlockKey) {
        causesInUz.push(n.id);
      }
    });

    const causeSet = new Set(causesInUz);
    graph.links.forEach(l => {
      if (l.type !== 'effect') return;
      const s = linkNorm(l, 's');
      if (!causeSet.has(s)) return;
      ids.add(linkNorm(l, 't'));
    });

    (graph.blockLinks || []).forEach(bl => {
      const t = linkNorm(bl, 't');
      if (t !== uzId) return;
      const s = linkNorm(bl, 's');
      if (s && graph.nodeById.has(s)) ids.add(s);
    });

    addDownstreamCauseUzFromEffectLinks(graph, ids);
    return ids;
  }

  function resolveUzHopTargetNode(graph, effectTag, currentUz, effectNode) {
    const tag = normalizeTag(effectTag || '');
    const cur = normalizeTag(currentUz || '');
    if (!tag || tag === cur) return null;
    if (graph.uzBlocks && graph.uzBlocks.has(tag)) {
      const uz = graph.nodeById.get('uz_' + tag);
      if (uz) return uz;
    }
    const cids = graph.causeTagToNodeIds && graph.causeTagToNodeIds.get(tag);
    if (cids && cids.length) {
      for (let i = 0; i < cids.length; i++) {
        const c = graph.nodeById.get(cids[i]);
        if (!c || c.type !== 'cause' || !c.uzBlock) continue;
        if (normalizeTag(c.uzBlock) === cur) continue;
        if (graph.uzBlocks && graph.uzBlocks.has(c.uzBlock) && normalizeTag(c.uzBlock) === tag) {
          const uz = graph.nodeById.get('uz_' + c.uzBlock);
          if (uz) return uz;
        }
        return c;
      }
    }
    return effectNode || null;
  }

  /**
   * Drill UZ แบบก้าวเดียว: [UZ ที่คลิก] → [TRIP|DTTM|CLOSE|OPEN] → [UZ/แท็กปลายทาง]
   * คลิกปลายทางที่เป็น UZ เพื่อเดินโซ่คำสั่งต่อ (เช่น 040 → 0418 → 200)
   */
  function getUzCommandHopGraph(graph, uzBlockKey) {
    const empty = { nodes: [], links: [] };
    if (!graph || !uzBlockKey) return empty;
    const uzId = 'uz_' + uzBlockKey;
    const uzNode = graph.nodeById.get(uzId);
    if (!uzNode) return empty;

    const causeSet = new Set();
    graph.nodes.forEach(n => {
      if (n.type === 'cause' && n.uzBlock === uzBlockKey) causeSet.add(n.id);
    });

    const groups = new Map();
    graph.links.forEach(l => {
      if (!l || l.type !== 'effect') return;
      if (shouldHideHsResetEffectLink(l, graph)) return;
      const s = linkNorm(l, 's');
      if (!causeSet.has(s)) return;
      const t = linkNorm(l, 't');
      const eff = graph.nodeById.get(t);
      if (!eff || eff.type !== 'effect') return;
      const tag = normalizeTag(eff.effectTag || l.effectTag || '');
      const target = resolveUzHopTargetNode(graph, tag, uzBlockKey, eff);
      if (!target || target.id === uzId) return;
      const ak = normalizeEffectActionGroupKey(l.effectAction);
      const uzLike = target.type === 'uzblock' || /UZ/i.test(tag);
      if (!uzLike && !isNamedCommandAction(ak)) return;
      if (!groups.has(ak)) groups.set(ak, new Map());
      groups.get(ak).set(target.id, target);
    });

    const nodes = [uzNode];
    const links = [];
    const seen = new Set([uzId]);
    const safeUz = String(uzBlockKey).replace(/[^a-zA-Z0-9]/g, '_');
    const cmdOrder = ['TRIP', 'CLOSE', 'OPEN', 'DTTM', 'ACTIVATE', 'RESET'];
    const actionKeys = Array.from(groups.keys()).sort((a, b) => {
      const ia = cmdOrder.indexOf(a);
      const ib = cmdOrder.indexOf(b);
      const ra = ia < 0 ? 80 : ia;
      const rb = ib < 0 ? 80 : ib;
      if (ra !== rb) return ra - rb;
      return String(a).localeCompare(String(b));
    });

    const allTargetIds = new Set();
    groups.forEach(m => m.forEach((_, id) => allTargetIds.add(id)));
    const namedCount = actionKeys.filter(isNamedCommandAction).length;
    let onlySingleUzHop = false;
    if (allTargetIds.size === 1 && namedCount <= 1) {
      const onlyId = Array.from(allTargetIds)[0];
      const onlyNode = graph.nodeById.get(onlyId);
      onlySingleUzHop = !!(onlyNode && onlyNode.type === 'uzblock');
    }

    actionKeys.forEach(ak => {
      const targets = groups.get(ak);
      const useCmd = isNamedCommandAction(ak) && !onlySingleUzHop;
      let fromId = uzId;
      if (useCmd) {
        const cmdId = 'cmdhop_' + safeUz + '_' + ak;
        nodes.push({
          id: cmdId,
          type: 'effect_bundle',
          name: ak,
          bundleActionKey: ak,
          effectTargetId: '',
          effectTag: '',
          bundleFanIn: targets.size,
          causeTag: '',
          uzBlock: uzBlockKey,
          hopCommand: true,
        });
        seen.add(cmdId);
        links.push({
          source: uzId,
          target: cmdId,
          type: 'effect_bundle_in',
          effectAction: ak,
        });
        fromId = cmdId;
      }
      targets.forEach(tn => {
        if (!seen.has(tn.id)) {
          nodes.push(tn);
          seen.add(tn.id);
        }
        links.push({
          source: fromId,
          target: tn.id,
          type: useCmd ? 'effect_bundle_out' : 'uz-effect',
          effectAction: ak,
          effectTag: tn.effectTag || tn.causeTag || tn.uzBlock || '',
        });
      });
    });

    return { nodes, links };
  }

  function populateUzBlockDropdown() {
    const sel = document.getElementById('uz-block-select');
    if (!sel) return;
    if (!graphData || !graphData.uzBlocks || graphData.uzBlocks.size === 0) {
      sel.innerHTML = '<option value="">— โหลดไฟล์ก่อน —</option>';
      sel.disabled = true;
      return;
    }
    const prev = sel.value;
    sel.disabled = false;
    sel.innerHTML = '<option value="">— เลือก UZ BLOCK —</option>';
    const keys = Array.from(graphData.uzBlocks).sort((a, b) => String(a).localeCompare(String(b)));
    keys.forEach(k => {
      const n = graphData.nodeById.get('uz_' + k);
      let label = k;
      if (n && n.uzDesc) {
        const short = String(n.uzDesc).replace(/\s+/g, ' ').trim();
        label = short.length > 72 ? (k + ' — ' + short.slice(0, 69) + '…') : (k + (short ? ' — ' + short : ''));
      }
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = label;
      sel.appendChild(opt);
    });
    if (prev && graphData.uzBlocks.has(prev)) sel.value = prev;
  }

  function syncUzBlockDropdown() {
    const sel = document.getElementById('uz-block-select');
    if (!sel || !graphData || !graphData.uzBlocks) return;
    const ub = drillState.mode === 'uz' && drillState.uzBlock ? drillState.uzBlock : '';
    if (ub && graphData.uzBlocks.has(ub)) sel.value = ub;
    else sel.value = '';
  }

  function effectHasOutgoingCauseLinks(graph, effectId) {
    let ok = false;
    graph.links.forEach(l => {
      if (l.type !== 'cause-link') return;
      if (linkNorm(l, 's') === effectId) ok = true;
    });
    return ok;
  }

  function getEffectBridgeDrillSet(graph, effectId) {
    const out = new Set([effectId]);
    const crossCauses = [];
    graph.links.forEach(l => {
      if (l.type !== 'cause-link') return;
      if (linkNorm(l, 's') !== effectId) return;
      const tid = linkNorm(l, 't');
      const cn = graph.nodeById.get(tid);
      if (cn && cn.type === 'cause') crossCauses.push(tid);
    });
    graph.links.forEach(l => {
      if (l.type !== 'effect') return;
      if (!crossCauses.includes(linkNorm(l, 's'))) return;
      out.add(linkNorm(l, 't'));
    });
    return out;
  }

  function getEffectDetailDisplayGraph(graph, effectId) {
    const eff = graph.nodeById.get(effectId);
    if (!eff || eff.type !== 'effect') return { nodes: [], links: [] };
    const safe = effectId.replace(/[^a-zA-Z0-9_-]/g, '_');
    const tagId = 'vd_' + safe + '_tag';
    const descId = 'vd_' + safe + '_desc';
    const descFull = (eff.effectDescs && eff.effectDescs.length) ? eff.effectDescs.join(' | ') : (eff.effectDesc || '—');
    const tagNode = {
      id: tagId,
      name: eff.effectTag || 'Effect_Tag',
      type: 'detail_tag',
      effectTag: eff.effectTag || '',
      causeTag: '',
      uzBlock: '',
    };
    const descNode = {
      id: descId,
      name: descFull.length > 90 ? descFull.slice(0, 87) + '...' : descFull,
      type: 'detail_desc',
      detailText: descFull,
      effectTag: '',
      causeTag: '',
      uzBlock: '',
    };
    return {
      nodes: [tagNode, descNode],
      links: [{ source: tagId, target: descId, type: 'detail-link' }],
    };
  }

  function getOneStepNextSet(graph, startNodeId) {
    const start = graph.nodeById.get(startNodeId);
    if (!start) return new Set([startNodeId]);
    const out = new Set([startNodeId]);

    const norm = (x) => typeof x === 'object' ? x.id : x;

    if (start.type === 'cause') {
      // Cause -> (immediate) Effects only (one step) + โหนด UZ BLOCK ของ Cause นี้ (เส้น contains)
      graph.links.forEach(l => {
        if (l.type !== 'effect') return;
        const s = norm(l.source);
        if (s !== startNodeId) return;
        out.add(norm(l.target));
      });
      if (start.uzBlock) {
        const uzId = 'uz_' + start.uzBlock;
        if (graph.nodeById.has(uzId)) out.add(uzId);
      }
      return out;
    }

    if (start.type === 'effect') {
      // Effect -> Cause แม่: ลิงก์ Cause→Effect ปกติ + cause-link (Effect เป็นต้นทาง)
      graph.links.forEach(l => {
        if (l.type === 'effect') {
          const t = norm(l.target);
          if (t !== startNodeId) return;
          const sid = norm(l.source);
          const sn = graph.nodeById.get(sid);
          if (sn && sn.type === 'cause') out.add(sid);
          return;
        }
        if (l.type === 'cause-link') {
          const s = norm(l.source);
          if (s !== startNodeId) return;
          const t = norm(l.target);
          const tn = graph.nodeById.get(t);
          if (tn && tn.type === 'cause') out.add(t);
        }
      });
      return out;
    }

    // Default fallback: whole connected component
    return getConnectedComponent(graph, startNodeId);
  }

  /** เพิ่ม uz_<block> เข้า set เมื่อมี Cause ใน set (เช่น ผลค้นหา) เพื่อให้เห็น UZ BLOCK → Cause */
  function addUzBlockNodesForCausesInSet(graph, idSet) {
    if (!graph || !idSet || !idSet.size) return;
    idSet.forEach(id => {
      const n = graph.nodeById.get(id);
      if (!n || n.type !== 'cause' || !n.uzBlock) return;
      const uzId = 'uz_' + n.uzBlock;
      if (graph.nodeById.has(uzId)) idSet.add(uzId);
    });
  }

  /**
   * Effect_Tag (โหนด Effect) ไปเป็น Cause_Tag ในแถว/UZ อื่น (ลิงก์ cause-link) → ใส่ Cause ปลายทาง + UZ BLOCK ของ UZ นั้น
   */
  function addDownstreamCauseUzFromEffectLinks(graph, idSet) {
    if (!graph || !idSet || !idSet.size) return;
    const extra = [];
    idSet.forEach(id => {
      const n = graph.nodeById.get(id);
      if (!n || n.type !== 'effect') return;
      graph.links.forEach(l => {
        if (l.type !== 'cause-link') return;
        if (linkNorm(l, 's') !== id) return;
        const causeId = linkNorm(l, 't');
        const cn = graph.nodeById.get(causeId);
        if (!cn || cn.type !== 'cause' || !cn.uzBlock) return;
        const uzId = 'uz_' + cn.uzBlock;
        if (graph.nodeById.has(uzId)) {
          extra.push(causeId, uzId);
        }
      });
    });
    extra.forEach(eid => idSet.add(eid));
  }

  let graphData = null;
  let isolatedSet = null;
  /** 'home' | 'uz' | 'search' | 'effect_bridge' | 'effect_next_uz' | 'effect_detail' | 'effect_drill_up' — mode uz: uzShowCauses false = UZ→command→ปลายทาง (ก้าวเดียว); true = แสดง Cause ใน UZ */
  let drillState = { mode: 'home' };
  /** stack ของมุมมองก่อนเปลี่ยน (สำหรับปุ่มย้อนกลับ) */
  let viewHistory = [];
  let graphInstance = null;
  let mode3d = false;
  let container = null;
  let lastPointer = { x: 0, y: 0 };
  let lastNodeCount = 0;
  let lastVisibleGraphForLayout = { nodes: [], links: [] };
  let linkDistanceListenerAttached = false;
  let layoutResizeTimer = null;
  let layoutResizeListenerAttached = false;
  /** โฟกัสจากคลิกเส้น Action: { nodeIds: Set, linkMatch(l) } | null */
  let actionLinkFocus = null;
  /** หน้าแรก UZ: ขยับเบาๆ รอบจุดที่กระจายเต็มจอ */
  let homeUzAmbientActive = false;

  function isHomePageView() {
    return drillState.mode === 'home' && !isolatedSet;
  }

  /** Drill UZ แบบเต็ม: แสดง Cause_Tag (ระดับเดียวกับตัวอย่างกราฟละเอียด) */
  function isUzFullDrillWithCauses() {
    return drillState.mode === 'uz' && !!drillState.uzBlock && drillState.uzShowCauses === true;
  }

  /** Drill UZ ก้าวเดียว: ต้นทาง → TRIP/DTTM/… → ปลายทาง */
  function isUzCommandHopView() {
    return drillState.mode === 'uz' && !!drillState.uzBlock && drillState.uzShowCauses === false;
  }

  function isNamedCommandAction(ak) {
    const u = String(ak || '').toUpperCase();
    return u === 'TRIP' || u === 'CLOSE' || u === 'OPEN' || u === 'DTTM' || u === 'ACTIVATE' || u === 'RESET';
  }

  function noDirectionalParticlesView() {
    return isHomePageView() || drillState.mode === 'effect_detail';
  }

  /** หน้าแรก: มีเฉพาะ UZ BLOCK + block-link */
  function isHomeUzOverview(nodes, links) {
    if (!isHomePageView()) return false;
    if (!nodes || !nodes.length) return false;
    if (!nodes.every(n => n.type === 'uzblock')) return false;
    if (!links || !links.length) return true;
    return links.every(l => (l.type || '') === 'block-link');
  }

  function clearHomeUzLayoutPropsOnNodes(nodes) {
    if (!nodes) return;
    nodes.forEach(n => {
      delete n._homeLayoutX;
      delete n._homeLayoutY;
      delete n._homeMotionPhase;
    });
  }

  function setHomeUzMotionPhases(nodes) {
    if (!nodes) return;
    nodes.forEach(nd => {
      let h = 2166136261;
      const s = String(nd.id || '');
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      nd._homeMotionPhase = (Math.abs(h) % 10000) / 10000 * Math.PI * 2;
    });
  }

  function clearNodeFixedPositions(nodes) {
    if (!nodes) return;
    nodes.forEach(n => {
      if (!n) return;
      delete n.fx;
      delete n.fy;
    });
  }

  function applyHomeUzAmbientDrawOffset() {
    if (!isHomePageView() || !graphInstance) return;
    const gd = graphInstance.graphData();
    const ns = gd && gd.nodes;
    if (!ns || !ns.length) return;
    const t = performance.now() * 0.00042;
    ns.forEach(n => {
      if (n.type !== 'uzblock' || n._homeLayoutX == null) return;
      if (n.fx != null || n.fy != null) return;
      const ph = n._homeMotionPhase != null ? n._homeMotionPhase : 0;
      const amp = 6.4 + 1.6 * Math.sin(ph * 2.1);
      n.x = n._homeLayoutX + amp * Math.sin(t * 0.95 + ph);
      n.y = n._homeLayoutY + amp * Math.cos(t * 0.78 + ph * 1.65);
    });
  }

  function neutralizeHomeSimForces(g) {
    if (!g || typeof g.d3Force !== 'function') return;
    try {
      const ch = g.d3Force('charge');
      if (ch && typeof ch.strength === 'function') ch.strength(0);
      const linkF = g.d3Force('link');
      if (linkF && typeof linkF.strength === 'function') linkF.strength(0);
      g.d3Force('collide', null);
      g.d3Force('center', null);
      g.d3Force('ltrFlow', null);
    } catch (e) { /* ignore */ }
  }

  /**
   * หน้าแรก: กระจาย UZ BLOCK เต็มพื้นที่จอ (วงรี→สี่เหลี่ยม) แล้วแยกกล่องไม่ให้ทับ
   * จากนั้นขยับเบาๆ รอบจุดเหล่านี้ — ไม่ให้ charge/link ดึงก้อนกลับมาซ้อนกัน
   */
  function assignHomeUzBlockTargets(nodes, links) {
    const el = document.getElementById('graph-container');
    const W = (el && el.clientWidth) || 920;
    const H = (el && el.clientHeight) || 680;
    const fill = 0.95;
    const uw = W * fill;
    const uh = H * fill;
    const n = nodes.length;
    if (!n) return;
    clearHomeUzLayoutPropsOnNodes(nodes);
    setHomeUzMotionPhases(nodes);
    if (n === 1) {
      nodes[0]._homeLayoutX = 0;
      nodes[0]._homeLayoutY = 0;
      return;
    }

    const boxHalfW = 78;
    const boxHalfH = 28;
    const hw = Math.max(uw / 2 - boxHalfW, 40);
    const hh = Math.max(uh / 2 - boxHalfH, 28);
    const golden = Math.PI * (3 - Math.sqrt(5));
    const ordered = nodes.slice().sort((a, b) =>
      String(a.uzBlock || a.id || '').localeCompare(String(b.uzBlock || b.id || ''), undefined, { numeric: true }));

    for (let i = 0; i < n; i++) {
      const theta = i * golden;
      const rho = Math.sqrt((i + 0.35) / n);
      let ux = rho * Math.cos(theta);
      let uy = rho * Math.sin(theta);
      const c = Math.cos(theta);
      const s = Math.sin(theta);
      const den = Math.max(Math.abs(c), Math.abs(s), 1e-6);
      const squareScale = 1 / den;
      const k = 0.78;
      const m = 1 + k * (squareScale - 1);
      ordered[i]._homeLayoutX = ux * m * hw;
      ordered[i]._homeLayoutY = uy * m * hh;
    }

    const minDx = 168;
    const minDy = 54;
    for (let iter = 0; iter < 42; iter++) {
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = ordered[i];
          const b = ordered[j];
          const dx = b._homeLayoutX - a._homeLayoutX;
          const dy = b._homeLayoutY - a._homeLayoutY;
          const nx = dx / minDx;
          const ny = dy / minDy;
          const d2 = nx * nx + ny * ny;
          if (d2 >= 1 || d2 <= 1e-8) continue;
          const d = Math.sqrt(d2);
          const push = (1 - d) * 0.52;
          const px = (nx / d) * minDx * push * 0.5;
          const py = (ny / d) * minDy * push * 0.5;
          a._homeLayoutX -= px;
          a._homeLayoutY -= py;
          b._homeLayoutX += px;
          b._homeLayoutY += py;
        }
      }
      ordered.forEach(nd => {
        nd._homeLayoutX = Math.max(-hw, Math.min(hw, nd._homeLayoutX));
        nd._homeLayoutY = Math.max(-hh, Math.min(hh, nd._homeLayoutY));
      });
    }

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    ordered.forEach(nd => {
      minX = Math.min(minX, nd._homeLayoutX);
      maxX = Math.max(maxX, nd._homeLayoutX);
      minY = Math.min(minY, nd._homeLayoutY);
      maxY = Math.max(maxY, nd._homeLayoutY);
    });
    const bw = Math.max(maxX - minX, 1);
    const bh = Math.max(maxY - minY, 1);
    const scaleX = (hw * 2) / bw;
    const scaleY = (hh * 2) / bh;
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    ordered.forEach(nd => {
      nd._homeLayoutX = (nd._homeLayoutX - cx) * scaleX;
      nd._homeLayoutY = (nd._homeLayoutY - cy) * scaleY;
      nd._homeLayoutX = Math.max(-hw, Math.min(hw, nd._homeLayoutX));
      nd._homeLayoutY = Math.max(-hh, Math.min(hh, nd._homeLayoutY));
    });
  }

  function removeHomeUzLayoutForces(g) {
    if (!g || typeof g.d3Force !== 'function') return;
    try {
      g.d3Force('homeUx', null);
      g.d3Force('homeUy', null);
    } catch (e) { /* ignore */ }
  }

  /** อัปเดตเป้าหมายหน้าแรกหลัง resize / โหลดใหม่ — ปักพิกัดแล้วปล่อยให้ขยับเบาๆ */
  function refreshHomeUzLayoutForces(g, nodes, links) {
    if (!isHomeUzOverview(nodes, links) || !g || typeof g.d3Force !== 'function' || typeof d3 === 'undefined') return;
    assignHomeUzBlockTargets(nodes, links);
    clearNodeFixedPositions(nodes);
    neutralizeHomeSimForces(g);
    removeHomeUzLayoutForces(g);
    nodes.forEach(nd => {
      if (nd._homeLayoutX != null) {
        nd.x = nd._homeLayoutX;
        nd.y = nd._homeLayoutY;
        nd.vx = 0;
        nd.vy = 0;
      }
    });
    homeUzAmbientActive = true;
  }

  /** Effect + Cause แม่ทันที + UZ ของแต่ละ Cause (สำหรับ drill up) */
  function getEffectDrillUpSet(graph, effectId) {
    const out = getOneStepNextSet(graph, effectId);
    const uzAdd = [];
    out.forEach(id => {
      const n = graph.nodeById.get(id);
      if (n && n.type === 'cause' && n.uzBlock) uzAdd.push('uz_' + n.uzBlock);
    });
    uzAdd.forEach(u => out.add(u));
    return out;
  }

  function linkEndpointId(x) {
    return typeof x === 'object' ? x.id : x;
  }

  /** Connected component (undirected) ของโหนด UZ ผ่าน block-link จาก seed */
  function getUzBlockIdsInBlockLinkComponent(graph, seedUzId) {
    const out = new Set();
    if (!graph || !seedUzId || !graph.nodeById.has(seedUzId)) return out;
    const adj = new Map();
    (graph.blockLinks || []).forEach(bl => {
      const u = linkEndpointId(bl.source);
      const v = linkEndpointId(bl.target);
      if (!adj.has(u)) adj.set(u, []);
      if (!adj.has(v)) adj.set(v, []);
      adj.get(u).push(v);
      adj.get(v).push(u);
    });
    const q = [seedUzId];
    out.add(seedUzId);
    while (q.length) {
      const u = q.shift();
      const nbrs = adj.get(u);
      if (!nbrs) continue;
      for (let i = 0; i < nbrs.length; i++) {
        const w = nbrs[i];
        if (!out.has(w)) {
          out.add(w);
          q.push(w);
        }
      }
    }
    return out;
  }

  /** ซ่อนเส้น Cause(HS) → Effect เมื่อ E คอลัมน์เป็น Reset_* — ใช้ Reset box ที่โหนด Effect แทน */
  function shouldHideHsResetEffectLink(link, graph) {
    if (!graph || link.type !== 'effect') return false;
    const act = String(link.effectAction || '').toUpperCase();
    if (!act.includes('RESET')) return false;
    const src = graph.nodeById.get(linkEndpointId(link.source));
    if (!src || src.type !== 'cause') return false;
    const ct = String(src.causeTag || '').toUpperCase();
    return ct.includes('HS');
  }

  /** ซ่อนโหนด Cause HS ที่มีแต่ลิงก์ Reset ไป Effect (ทุกเส้นถูกซ่อนแล้ว — ไม่ต้องซ้ำกับ Reset box) */
  function shouldHideHsResetOnlyCauseNode(graph, node) {
    if (!graph || !node || node.type !== 'cause') return false;
    if (!String(node.causeTag || '').toUpperCase().includes('HS')) return false;
    const outgoing = [];
    graph.links.forEach(l => {
      if (l.type !== 'effect') return;
      if (linkEndpointId(l.source) !== node.id) return;
      outgoing.push(l);
    });
    if (outgoing.length === 0) return false;
    return outgoing.every(l => shouldHideHsResetEffectLink(l, graph));
  }

  /** Reset box ข้าง Effect: เฉพาะเมื่อมี Reset จาก Cause ที่ Cause_Tag มี HS (Hand switch) */
  function effectHasHsResetFromCause(node) {
    if (!node || node.type !== 'effect' || !Array.isArray(node.fromCauses)) return false;
    return node.fromCauses.some(fc => {
      const a = String(fc && fc.action ? fc.action : '').toUpperCase();
      const tag = String(fc && fc.causeTag ? fc.causeTag : '').toUpperCase();
      return a.includes('RESET') && tag.includes('HS');
    });
  }

  /** Effect_Tag เดียวกันมี Cause_Tag ใน UZ อื่น (ไม่ใช่แค่ UZ ของแถวที่ปล่อย Effect) — ใช้กรอบแดงบนโหนด Effect */
  function effectTagIsCauseInOtherUzBlock(graph, node) {
    if (!graph || !node || node.type !== 'effect' || !graph.causeTagToNodeIds) return false;
    const tag = normalizeTag(node.effectTag || '');
    if (!tag) return false;
    const cids = graph.causeTagToNodeIds.get(tag);
    if (!cids || !cids.length) return false;
    const originUz = new Set();
    (node.fromCauses || []).forEach(fc => {
      const c = graph.nodeById.get(fc.causeId);
      if (c && c.uzBlock) originUz.add(c.uzBlock);
    });
    for (let i = 0; i < cids.length; i++) {
      const c = graph.nodeById.get(cids[i]);
      if (!c || c.type !== 'cause' || !c.uzBlock) continue;
      if (!originUz.has(c.uzBlock)) return true;
    }
    return false;
  }

  /** UZ BLOCK ที่มีแถว Cause_Tag = Effect_Tag ของโหนด effect (สำหรับ drill ต่อเป็นชั้นๆ) */
  function getUzBlocksWhereEffectTagIsCause(graph, effectId) {
    const eff = graph.nodeById.get(effectId);
    if (!eff || eff.type !== 'effect' || !graph.causeTagToNodeIds) return [];
    const tag = normalizeTag(eff.effectTag);
    const cids = graph.causeTagToNodeIds.get(tag);
    if (!cids || !cids.length) return [];
    const uz = new Set();
    cids.forEach(cid => {
      const c = graph.nodeById.get(cid);
      if (c && c.uzBlock) uz.add(c.uzBlock);
    });
    return Array.from(uz);
  }

  function appendEffectNextUzSyntheticLinks(links, visIds) {
    if (drillState.mode !== 'effect_next_uz' || !drillState.effectId || !graphData) return;
    const eid = drillState.effectId;
    if (!visIds.has(eid)) return;
    getUzBlocksWhereEffectTagIsCause(graphData, eid).forEach(ub => {
      const tid = 'uz_' + ub;
      if (visIds.has(tid)) {
        links.push({ source: eid, target: tid, type: 'drill-next-uz' });
      }
    });
  }

  /**
   * มุมมอง drill UZ: ไม่แสดงโหนด Effect ที่แท็กตรงกับ UZ BLOCK อื่นในระบบ (เช่น 106-UZ-441)
   * เพื่อตัดเส้น Cause→Effect ที่ “ชี้ไป UZ อื่น” ที่รกกราฟ — เหลือบริบท UZ ที่เลือก + Cause + Effect ที่ไม่ใช่แท็ก UZ อื่น
   */
  function shouldHideCrossUzEffectInUzDrill(graph, node, currentUz) {
    if (!graph || !node || node.type !== 'effect' || !currentUz) return false;
    if (!graph.uzBlocks || !graph.uzBlocks.size) return false;
    const tag = normalizeTag(node.effectTag || '');
    if (!tag) return false;
    if (tag === normalizeTag(currentUz)) return false;
    return graph.uzBlocks.has(tag);
  }

  function pickCauseIdForEffectTag(graph, effectTag, preferredUz) {
    if (!graph || !graph.causeTagToNodeIds) return null;
    const tag = normalizeTag(effectTag || '');
    if (!tag) return null;
    const cids = graph.causeTagToNodeIds.get(tag);
    if (!cids || !cids.length) return null;
    if (preferredUz) {
      for (let i = 0; i < cids.length; i++) {
        const c = graph.nodeById.get(cids[i]);
        if (c && c.type === 'cause' && c.uzBlock === preferredUz) return c.id;
      }
    }
    return cids[0];
  }

  /**
   * Effect ที่ใช้แท็กเดียวกับ Cause → เหลือโหนดเขียว (Cause) อย่างเดียว
   * คืน effectId → causeId สำหรับรีไวร์ลิงก์
   */
  function mergeSameTagEffectsIntoCauses(graph, nodes, preferredUz) {
    const replace = new Map();
    if (!graph || !nodes) return replace;
    const nById = new Map(nodes.map(n => [n.id, n]));
    nodes.forEach(n => {
      if (!n || n.type !== 'effect') return;
      const causeId = pickCauseIdForEffectTag(graph, n.effectTag, preferredUz);
      if (!causeId || causeId === n.id) return;
      const cause = graph.nodeById.get(causeId);
      if (!cause || cause.type !== 'cause') return;
      replace.set(n.id, causeId);
      if (!nById.has(causeId)) {
        nodes.push(cause);
        nById.set(causeId, cause);
      }
    });
    if (!replace.size) return replace;
    for (let i = nodes.length - 1; i >= 0; i--) {
      if (replace.has(nodes[i].id)) nodes.splice(i, 1);
    }
    return replace;
  }

  function rewireLinksAfterEffectMerge(links, replace) {
    if (!links || !replace || !replace.size) return;
    for (let i = links.length - 1; i >= 0; i--) {
      const l = links[i];
      const s0 = typeof l.source === 'object' ? l.source.id : l.source;
      const t0 = typeof l.target === 'object' ? l.target.id : l.target;
      const s = replace.get(s0) || s0;
      const t = replace.get(t0) || t0;
      if (s === t) {
        links.splice(i, 1);
        continue;
      }
      if (l.type === 'cause-link' && (replace.has(s0) || replace.has(t0))) {
        links.splice(i, 1);
        continue;
      }
      l.source = s;
      l.target = t;
    }
  }

  /** จัดกลุ่ม Action เดียวกัน (Trip/Close/DTTM/...) ไป Effect เดียวกัน */
  function normalizeEffectActionGroupKey(effectAction) {
    const u = String(effectAction || '').trim().toUpperCase();
    if (u.includes('TRIP')) return 'TRIP';
    if (u.includes('CLOSE')) return 'CLOSE';
    if (u.includes('OPEN')) return 'OPEN';
    if (u.includes('DTTM')) return 'DTTM';
    if (u.includes('ACTIVATE')) return 'ACTIVATE';
    if (u.includes('RESET')) return 'RESET';
    return u || 'OTHER';
  }

  function actionAccentColor(actionKey) {
    const u = String(actionKey || '').toUpperCase();
    if (u.includes('TRIP')) return '#ef4444';
    if (u.includes('CLOSE')) return '#fb7185';
    if (u.includes('OPEN')) return '#22c55e';
    if (u.includes('DTTM')) return '#a78bfa';
    if (u.includes('ACTIVATE')) return '#3b82f6';
    if (u.includes('RESET')) return '#d9f99d';
    return '#94a3b8';
  }

  /**
   * ทุกเส้น Cause→Effect ได้โหนด Command กลางทาง (DTTM/CLOSE/TRIP/OPEN)
   * ถ้าหลาย Cause ยิง Action เดียวกันไป Effect เดียวกัน จะรวมเข้าโหนดเดียว
   */
  function bundleEffectLinksBySameAction(nodes, links) {
    if (!nodes || !links || links.length === 0) return;
    const nById = new Map(nodes.map(n => [n.id, n]));
    const effectLinks = [];
    const otherLinks = [];
    for (let i = 0; i < links.length; i++) {
      const l = links[i];
      if (l.type !== 'effect') {
        otherLinks.push(l);
        continue;
      }
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      if (!nById.has(s) || !nById.has(t)) {
        otherLinks.push(l);
        continue;
      }
      effectLinks.push({ link: l, s, t });
    }
    const groups = new Map();
    const GSEP = '\x1f';
    effectLinks.forEach(({ link, s, t }) => {
      const ak = normalizeEffectActionGroupKey(link.effectAction);
      const compoundKey = t + GSEP + ak;
      if (!groups.has(compoundKey)) groups.set(compoundKey, []);
      groups.get(compoundKey).push({ s, t, link });
    });
    const extraNodes = [];
    const outEffect = [];
    groups.forEach((arr, compoundKey) => {
      const sep = compoundKey.indexOf(GSEP);
      const t = compoundKey.slice(0, sep);
      const ak = compoundKey.slice(sep + 1);
      const safeT = String(t).replace(/[^a-zA-Z0-9]/g, '_');
      const bundleId = 'eb_' + safeT + '_' + ak;
      const effNode = nById.get(t);
      const tagLabel = effNode && effNode.effectTag ? effNode.effectTag : t;
      const bn = {
        id: bundleId,
        type: 'effect_bundle',
        name: ak,
        bundleActionKey: ak,
        effectTargetId: t,
        effectTag: tagLabel,
        bundleFanIn: arr.length,
        causeTag: '',
        uzBlock: '',
      };
      extraNodes.push(bn);
      nById.set(bundleId, bn);
      arr.forEach(({ s, link }) => {
        outEffect.push({
          source: s,
          target: bundleId,
          type: 'effect_bundle_in',
          effectAction: link.effectAction,
          effectTag: link.effectTag,
        });
      });
      outEffect.push({
        source: bundleId,
        target: t,
        type: 'effect_bundle_out',
        effectAction: arr[0].link.effectAction,
        effectTag: arr[0].link.effectTag,
      });
    });
    links.length = 0;
    otherLinks.forEach(l => links.push(l));
    outEffect.forEach(l => links.push(l));
    extraNodes.forEach(n => nodes.push(n));
  }

  function getVisibleGraph() {
    if (!graphData) return { nodes: [], links: [] };
    if (drillState.mode === 'effect_detail' && drillState.effectId) {
      return getEffectDetailDisplayGraph(graphData, drillState.effectId);
    }
    if (isUzCommandHopView()) {
      return getUzCommandHopGraph(graphData, drillState.uzBlock);
    }
    let nodes, links;
    if (isolatedSet && isolatedSet.size > 0) {
      nodes = graphData.nodes.filter(n => isolatedSet.has(n.id));
      nodes = nodes.filter(n => !shouldHideHsResetOnlyCauseNode(graphData, n));
      if (drillState.mode === 'uz' && drillState.uzBlock) {
        const curUz = drillState.uzBlock;
        nodes = nodes.filter(n => !shouldHideCrossUzEffectInUzDrill(graphData, n, curUz));
      }
      const mergedReplace = mergeSameTagEffectsIntoCauses(
        graphData,
        nodes,
        drillState.mode === 'uz' ? drillState.uzBlock : ''
      );
      const visIds = new Set(nodes.map(n => n.id));
      links = graphData.links.filter(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        if (!visIds.has(s) || !visIds.has(t)) return false;
        if (shouldHideHsResetEffectLink(l, graphData)) return false;
        return true;
      });
      rewireLinksAfterEffectMerge(links, mergedReplace);
      visIds.clear();
      nodes.forEach(n => visIds.add(n.id));
      links = links.filter(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        return visIds.has(s) && visIds.has(t) && s !== t;
      });
      (graphData.blockLinks || []).forEach(bl => {
        if (visIds.has(bl.source) && visIds.has(bl.target)) links.push(bl);
      });
      appendEffectNextUzSyntheticLinks(links, visIds);
      if (drillState.mode === 'uz' && drillState.uzBlock) {
        const uzId = 'uz_' + drillState.uzBlock;
        const mergedCauseIds = new Set(mergedReplace.values());
        if (visIds.has(uzId)) {
          const linked = new Set();
          links.forEach(l => {
            const s = typeof l.source === 'object' ? l.source.id : l.source;
            const t = typeof l.target === 'object' ? l.target.id : l.target;
            if (s === uzId) linked.add(t);
            if (t === uzId) linked.add(s);
          });
          nodes.forEach(n => {
            if (!visIds.has(n.id) || n.id === uzId || linked.has(n.id)) return;
            if (drillState.uzShowCauses === false && n.type === 'effect') {
              links.push({ source: uzId, target: n.id, type: 'uz-effect' });
              return;
            }
            if (n.type === 'cause' && mergedCauseIds.has(n.id)) {
              links.push({ source: uzId, target: n.id, type: 'uz-effect' });
            }
          });
        }
      }
      bundleEffectLinksBySameAction(nodes, links);
    } else {
      nodes = graphData.nodes.filter(n => n.type === 'uzblock');
      links = (graphData.blockLinks || []).slice();
    }
    return { nodes, links };
  }

  function nodeColorBase(n) {
    if (n.type === 'uzblock') return '#6b8cff';
    if (n.type === 'cause' && n.causeTag && n.causeTag.toUpperCase().includes('HS')) return '#22c55e';
    if (n.type === 'cause') return '#4ade80';
    if (n.type === 'effect') return '#fbbf24';
    if (n.type === 'effect_bundle') return actionAccentColor(n.bundleActionKey);
    if (n.type === 'detail_tag') return '#f59e0b';
    if (n.type === 'detail_desc') return '#8b5cf6';
    return '#a0a0b0';
  }

  function nodeColor(n) {
    if (actionLinkFocus && actionLinkFocus.nodeIds && !actionLinkFocus.nodeIds.has(n.id)) {
      return '#4b4b58';
    }
    return nodeColorBase(n);
  }

  function linkColorBase(link) {
    if (link.type === 'block-link' && isHomePageView()) {
      return 'rgba(253, 186, 116, 0.9)';
    }
    if (link.type === 'cause-link' && isUzFullDrillWithCauses()) {
      return 'rgba(200, 205, 225, 0.55)';
    }
    if (link.type === 'detail-link') return 'rgba(200,200,220,0.85)';
    if (link.type === 'drill-next-uz') return '#22d3ee';
    if (link.type === 'uz-effect') return 'rgba(245,245,252,0.92)';
    if (link.type === 'effect_bundle_in' || link.type === 'effect_bundle_out') {
      return actionAccentColor(link.effectAction);
    }
    const a = (link.effectAction || '').toUpperCase();
    if (a.includes('TRIP') || a.includes('CLOSE') || a.includes('OPEN') || a.includes('DTTM') || a.includes('ACTIVATE') || a.includes('RESET')) {
      return actionAccentColor(a);
    }
    return 'rgba(180,180,200,0.6)';
  }

  function linkColorDimAware(link) {
    if (actionLinkFocus && actionLinkFocus.linkMatch && !actionLinkFocus.linkMatch(link)) {
      return 'rgba(130,130,142,0.22)';
    }
    return linkColorBase(link);
  }

  function linkWidthForGraph(link) {
    if (link.type === 'block-link' && isHomePageView()) return 1.35;
    if (link.type === 'cause-link' && isUzFullDrillWithCauses()) return 1.22;
    if (isUzCommandHopView() && (link.type === 'effect_bundle_in' || link.type === 'effect_bundle_out' || link.type === 'uz-effect')) {
      return 1.7;
    }
    return 1;
  }

  function refreshActionLinkFocusStyles() {
    if (!graphInstance) return;
    if (typeof graphInstance.nodeColor === 'function') graphInstance.nodeColor(nodeColor);
    if (typeof graphInstance.linkColor === 'function') graphInstance.linkColor(linkColorDimAware);
  }

  function clearActionLinkFocus() {
    actionLinkFocus = null;
    refreshActionLinkFocusStyles();
  }

  function setActionLinkFocusFromClick(link) {
    if (!link || !graphInstance || typeof graphInstance.graphData !== 'function') return;
    const typ = link.type || '';
    const s = linkEndpointId(link.source);
    const t = linkEndpointId(link.target);
    let signature = typ + '\x1e' + s + '\x1e' + t;
    if (typ === 'effect') {
      signature += '\x1e' + normalizeEffectActionGroupKey(link.effectAction);
    } else if (typ === 'effect_bundle_in' || typ === 'effect_bundle_out') {
      signature += '\x1e' + normalizeEffectActionGroupKey(link.effectAction || '');
    } else if (typ === 'block-link' && graphData) {
      const uzCompSig = getUzBlockIdsInBlockLinkComponent(graphData, s);
      signature = 'block-link-comp\x1e' + Array.from(uzCompSig).sort().join('\x1f');
    } else if (typ === 'cause-link' && graphData) {
      const cn = graphData.nodeById.get(t);
      const tUb = cn && cn.type === 'cause' && cn.uzBlock ? cn.uzBlock : '';
      signature = 'cause-link-focus\x1e' + s + '\x1e' + tUb;
    }
    if (actionLinkFocus && actionLinkFocus.signature === signature) {
      clearActionLinkFocus();
      return;
    }
    const gd = graphInstance.graphData();
    const allLinks = (gd && gd.links) ? gd.links : [];
    const nodeIds = new Set();
    let linkMatch = null;

    if (typ === 'effect') {
      const effectId = t;
      const ak = normalizeEffectActionGroupKey(link.effectAction);
      nodeIds.add(effectId);
      allLinks.forEach(l => {
        if (l.type !== 'effect') return;
        if (linkEndpointId(l.target) !== effectId) return;
        if (normalizeEffectActionGroupKey(l.effectAction) !== ak) return;
        nodeIds.add(linkEndpointId(l.source));
      });
      if (graphData) {
        nodeIds.forEach(id => {
          const n = graphData.nodeById.get(id);
          if (n && n.type === 'cause' && n.uzBlock) {
            const uz = 'uz_' + n.uzBlock;
            if (graphData.nodeById.has(uz)) nodeIds.add(uz);
          }
        });
      }
      linkMatch = function (l) {
        if (l.type !== 'effect') return false;
        return linkEndpointId(l.target) === effectId && normalizeEffectActionGroupKey(l.effectAction) === ak;
      };
    } else if (typ === 'effect_bundle_in') {
      const bundleId = t;
      nodeIds.add(bundleId);
      let effTgt = null;
      (gd.nodes || []).forEach(n => {
        if (n && n.id === bundleId && n.effectTargetId) effTgt = n.effectTargetId;
      });
      if (effTgt) nodeIds.add(effTgt);
      allLinks.forEach(l => {
        if (l.type === 'effect_bundle_in' && linkEndpointId(l.target) === bundleId) {
          nodeIds.add(linkEndpointId(l.source));
        }
      });
      if (graphData && effTgt) {
        nodeIds.forEach(id => {
          const n = graphData.nodeById.get(id);
          if (n && n.type === 'cause' && n.uzBlock) {
            const uz = 'uz_' + n.uzBlock;
            if (graphData.nodeById.has(uz)) nodeIds.add(uz);
          }
        });
      }
      linkMatch = function (l) {
        const ls = linkEndpointId(l.source);
        const lt = linkEndpointId(l.target);
        if (l.type === 'effect_bundle_in' && lt === bundleId) return true;
        if (l.type === 'effect_bundle_out' && ls === bundleId) return true;
        return false;
      };
    } else if (typ === 'effect_bundle_out') {
      const bundleId = s;
      const effectId = t;
      nodeIds.add(bundleId);
      nodeIds.add(effectId);
      allLinks.forEach(l => {
        if (l.type === 'effect_bundle_in' && linkEndpointId(l.target) === bundleId) {
          nodeIds.add(linkEndpointId(l.source));
        }
      });
      if (graphData) {
        nodeIds.forEach(id => {
          const n = graphData.nodeById.get(id);
          if (n && n.type === 'cause' && n.uzBlock) {
            const uz = 'uz_' + n.uzBlock;
            if (graphData.nodeById.has(uz)) nodeIds.add(uz);
          }
        });
      }
      linkMatch = function (l) {
        const ls = linkEndpointId(l.source);
        const lt = linkEndpointId(l.target);
        if (l.type === 'effect_bundle_in' && lt === bundleId) return true;
        if (l.type === 'effect_bundle_out' && ls === bundleId && lt === effectId) return true;
        return false;
      };
    } else if (typ === 'uz-effect') {
      nodeIds.add(s);
      nodeIds.add(t);
      linkMatch = function (l) {
        return l.type === 'uz-effect' && linkEndpointId(l.source) === s && linkEndpointId(l.target) === t;
      };
    } else if (typ === 'block-link') {
      if (!graphData) return;
      const uzComp = getUzBlockIdsInBlockLinkComponent(graphData, s);
      uzComp.forEach(id => nodeIds.add(id));
      linkMatch = function (l) {
        if (l.type !== 'block-link') return false;
        const ls = linkEndpointId(l.source);
        const lt = linkEndpointId(l.target);
        return uzComp.has(ls) && uzComp.has(lt);
      };
    } else if (typ === 'cause-link') {
      if (!graphData) return;
      const effNode = graphData.nodeById.get(s);
      const causeNode = graphData.nodeById.get(t);
      if (!effNode || effNode.type !== 'effect' || !causeNode || causeNode.type !== 'cause') return;
      const targetUb = causeNode.uzBlock || '';
      if (!targetUb) return;
      const uzTarget = 'uz_' + targetUb;

      nodeIds.add(s);
      graphData.links.forEach(l => {
        if (l.type !== 'cause-link') return;
        if (linkEndpointId(l.source) !== s) return;
        const cid = linkEndpointId(l.target);
        const cn = graphData.nodeById.get(cid);
        if (cn && cn.type === 'cause' && cn.uzBlock === targetUb) nodeIds.add(cid);
      });
      if (graphData.nodeById.has(uzTarget)) nodeIds.add(uzTarget);

      graphData.links.forEach(l => {
        if (l.type !== 'effect') return;
        if (linkEndpointId(l.target) !== s) return;
        const cid = linkEndpointId(l.source);
        nodeIds.add(cid);
        const c = graphData.nodeById.get(cid);
        if (c && c.uzBlock) {
          const uid = 'uz_' + c.uzBlock;
          if (graphData.nodeById.has(uid)) nodeIds.add(uid);
        }
      });

      linkMatch = function (l) {
        const ls = linkEndpointId(l.source);
        const lt = linkEndpointId(l.target);
        if (!nodeIds.has(ls) || !nodeIds.has(lt)) return false;
        const ty = l.type || '';
        if (ty === 'effect' || ty === 'cause-link' || ty === 'contains' || ty === 'block-link') return true;
        return false;
      };
    } else {
      return;
    }

    actionLinkFocus = { nodeIds, linkMatch, signature };
    refreshActionLinkFocusStyles();
  }

  function nodeLabel(n) {
    if (n.type === 'uzblock') return n.uzBlock || n.name || n.id;
    if (n.type === 'cause') return n.causeTag || n.name || n.id;
    if (n.type === 'effect') return n.effectTag || n.name || n.id;
    if (n.type === 'effect_bundle') return n.bundleActionKey || n.name || n.id;
    return n.name || n.id;
  }

        const ct = String(fc && fc.causeTag ? fc.causeTag : '').trim();
        if (a.includes('RESET') && ct && ct.toUpperCase().includes('HS')) resetBy.push(ct);
      });
      const uniq = Array.from(new Set(resetBy));
      if (uniq.length) {
